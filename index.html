<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>اخدملي — خدمات المنزل والحرفيين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4F4;--card:#fff;--ink:#12292D;--mut:#5B7276;
  --pri:#0B6B76;--pri2:#095560;--on:#fff;--acc:#F59E0B;
  --line:#D5E2E3;--ok:#157347;--bad:#B3261E;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1C1F;--card:#15292D;--ink:#E7F1F2;--mut:#93ABAF;
    --pri:#2BB3C0;--pri2:#5CCAD5;--on:#06262A;--line:#254247;
    --ok:#5BD48A;--bad:#FF8A80;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1C1F;--card:#15292D;--ink:#E7F1F2;--mut:#93ABAF;
  --pri:#2BB3C0;--pri2:#5CCAD5;--on:#06262A;--line:#254247;
  --ok:#5BD48A;--bad:#FF8A80;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Cairo,Tahoma,Arial,sans-serif;font-size:15.5px;line-height:1.6;
  padding-bottom:88px;
}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--card);
  border-bottom:1px solid var(--line);padding:12px 16px;
}
.topbar-in{
  max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(180deg,#169AA6,#0A5C68);
  display:grid;place-items:center;flex:none;
}
.brand b{display:block;font-size:19px;font-weight:800;line-height:1.15}
.brand small{color:var(--mut);font-size:12.5px}
.icon-btn{
  margin-inline-start:auto;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;flex:none;padding:0;
}
main{max-width:680px;margin:0 auto;padding:14px 16px 20px}
.search{position:relative}
.search input{
  width:100%;font:inherit;color:var(--ink);background:var(--card);
  border:1.5px solid var(--line);border-radius:14px;
  padding:11px 42px 11px 14px;outline:none;
}
.search input:focus{border-color:var(--pri)}
.search .s-ic{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--mut);display:flex}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{
  flex:none;display:inline-flex;align-items:center;gap:6px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:7px 14px;font:inherit;font-size:13.5px;
  font-weight:700;cursor:pointer;white-space:nowrap;
}
.cat[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--on)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.top{display:flex;gap:12px;align-items:center}
.av{
  width:52px;height:52px;border-radius:50%;
  background:color-mix(in srgb,var(--pri) 15%,var(--card));
  color:var(--pri2);display:grid;place-items:center;flex:none;
}
.top h3{margin:0;font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sub{color:var(--mut);font-size:13px}
.rating{color:var(--acc);font-weight:800}
.desc{margin:10px 0 12px;font-size:14.5px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  flex:1;min-width:95px;text-align:center;text-decoration:none;font:inherit;
  font-weight:700;font-size:13.5px;border-radius:11px;padding:9px 12px;
  border:1.5px solid var(--pri);color:var(--pri2);background:transparent;cursor:pointer;
}
.btn.main{background:var(--pri);color:var(--on)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{flex:0 0 auto;min-width:auto;padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{
  font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;
  background:color-mix(in srgb,var(--acc) 22%,var(--card));white-space:nowrap;
}
.badge.ok{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ok)}
.badge.bad{background:color-mix(in srgb,var(--bad) 18%,var(--card));color:var(--bad)}
input,textarea,select{
  width:100%;font:inherit;color:var(--ink);background:var(--card);
  border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;
}
label{display:block;font-weight:700;font-size:13.5px;margin:10px 0 4px}
.empty{text-align:center;color:var(--mut);padding:36px 16px}
.empty b{display:block;color:var(--ink);font-size:16.5px;margin-bottom:4px}
.chat-box{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  display:flex;flex-direction:column;height:calc(100vh - 185px);min-height:360px;overflow:hidden;
}
.chat-head{
  padding:10px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;background:var(--card);
}
.chat-msgs{
  flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;
  background:color-mix(in srgb,var(--bg) 55%,transparent);
}
.msg{
  max-width:80%;padding:9px 13px;border-radius:14px;font-size:14.5px;line-height:1.5;
  word-wrap:break-word;
}
.msg.me{
  align-self:flex-start;background:var(--pri);color:var(--on);
  border-bottom-right-radius:4px;
}
.msg.them{
  align-self:flex-end;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-bottom-left-radius:4px;
}
.msg-meta{font-size:11px;opacity:.75;margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.chat-form{
  padding:10px;border-top:1px solid var(--line);background:var(--card);
  display:flex;gap:8px;align-items:center;
}
.chat-form input{flex:1;padding:9px 12px}
.auth-tabs{display:flex;gap:8px;margin-bottom:12px}
.auth-tabs button{flex:1}
.auth-err{color:var(--bad);font-size:13px;font-weight:700;margin-top:8px;min-height:20px}
nav{
  position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20;
}
nav button{
  flex:1;border:0;background:none;font:inherit;font-size:12px;
  color:var(--mut);padding:8px 4px 6px;cursor:pointer;position:relative;
}
nav button svg{display:block;margin:0 auto 3px}
nav button[aria-current="page"]{color:var(--pri2);font-weight:800}
.nav-cnt{
  position:absolute;top:4px;inset-inline-end:calc(50% - 22px);
  min-width:17px;height:17px;padding:0 4px;border-radius:999px;
  background:var(--acc);color:#12292D;font-size:10.5px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;line-height:1;
}
dialog{
  width:min(92vw,460px);border:0;border-radius:18px;padding:18px;
  background:var(--card);color:var(--ink);
}
dialog::backdrop{background:rgba(0,0,0,.5)}
#toast{
  position:fixed;inset-inline:16px;bottom:84px;margin:auto;max-width:360px;
  background:var(--ink);color:var(--bg);text-align:center;border-radius:12px;
  padding:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:50;
}
#toast.on{opacity:1}
</style>
</head>

function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : structuredClone(DEFAULT_DATA);
    if(!parsed.messages) parsed.messages = [];
    if(!parsed.paymentSettings) parsed.paymentSettings = structuredClone(DEFAULT_DATA.paymentSettings);
    if(!parsed.userProfile) parsed.userProfile = structuredClone(DEFAULT_DATA.userProfile);
    if(!parsed.reviews) parsed.reviews = [];
    if(!parsed.transactions) parsed.transactions = [];
    if(!parsed.withdrawals) parsed.withdrawals = [];
    parsed.pros = (parsed.pros || []).map(p => ({ available: true, ...p }));
    parsed.orders = (parsed.orders || []).map(o => ({ ratingGiven: 0, reviewText: "", ...o }));
    return parsed;
  }catch(e){
    return structuredClone(DEFAULT_DATA);
  }
}

function updateThemeIcon(){

function toggleTheme(){

function initSupabaseClient(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase?.createClient) return null;
  if(!sbClient){
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
  }
  return sbClient;
}

async function ensureUserProfileAndStatus(user){
  const client = initSupabaseClient();
  if(!client || !user) return null;
  try{
    let { data: prof, error } = await client
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();
    if(error) throw error;

    if(!prof){
      const meta = user.user_metadata || {};
      const { data: inserted } = await client
        .from("profiles")
        .upsert({
          id: user.id,
          full_name: meta.full_name || db.userProfile.name || user.email?.split("@")[0] || "مستخدم",
          phone: meta.phone || db.userProfile.phone || "",
          city: meta.city || db.userProfile.city || "البيضاء",
          role: "user",
          is_active: true
        }, { onConflict: "id" })
        .select("*")
        .maybeSingle();
      if(inserted) prof = inserted;
    }

    if(prof && prof.is_active === false){
      authBannerMessage = "تم إيقاف هذا الحساب من قِبل الإدارة. يرجى التواصل مع الدعم.";
      await client.auth.signOut();
      currentAuthUser = null;
      currentAuthProfile = null;
      render();
      return null;
    }

    currentAuthUser = user;
    currentAuthProfile = prof || { id: user.id, full_name: user.user_metadata?.full_name || "", is_active: true, role: "user" };
    authBannerMessage = "";

    if(currentAuthProfile.full_name) db.userProfile.name = currentAuthProfile.full_name;
    if(currentAuthProfile.phone) db.userProfile.phone = currentAuthProfile.phone;
    if(currentAuthProfile.city) db.userProfile.city = currentAuthProfile.city;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){}
    return currentAuthProfile;
  }catch(e){
    console.warn("User profile check warning:", e?.message || e);
    currentAuthUser = user;
    return currentAuthProfile;
  }
}

function initAuthListener(){
  const client = initSupabaseClient();
  if(!client || client._akhdimliUserAuthBound) return;
  client._akhdimliUserAuthBound = true;

  client.auth.getSession().then(async ({ data })=>{
    if(data?.session?.user){
      await ensureUserProfileAndStatus(data.session.user);
      render();
    }
  });

  client.auth.onAuthStateChange(async (event, session)=>{
    if(session?.user){
      await ensureUserProfileAndStatus(session.user);
      render();
    } else if(event === "SIGNED_OUT"){
      currentAuthUser = null;
      currentAuthProfile = null;
      render();
    }
  });
}

      <label>كلمة المرور</label>
      <input type="password" id="authPass" placeholder="••••••••" autocomplete="${mode==="login"?"current-password":"new-password"}">
      <div class="auth-err" id="authModalErr">${authBannerMessage || ""}</div>
      <div class="row" style="margin-top:14px">
        <button type="button" class="btn" id="authCancel">إغلاق</button>
        <button type="button" class="btn main" id="authSubmit">${mode === "login" ? "دخول" : "إنشاء الحساب"}</button>
      </div>
    `;
    document.getElementById("mTabLogin").onclick = ()=>{ mode = "login"; paint(); };
    document.getElementById("mTabSignup").onclick = ()=>{ mode = "signup"; paint(); };
    document.getElementById("authCancel").onclick = ()=>dlg.close();

    document.getElementById("authSubmit").onclick = async ()=>{
      const errEl = document.getElementById("authModalErr");
      const btn = document.getElementById("authSubmit");
      const email = (document.getElementById("authEmail")?.value || "").trim();
      const password = document.getElementById("authPass")?.value || "";
      if(!email || !password){
        errEl.textContent = "يرجى إدخال البريد الإلكتروني وكلمة المرور.";
        return;
      }
      btn.disabled = true;
      errEl.textContent = "";
      try{
        if(mode === "login"){
          const { data, error } = await client.auth.signInWithPassword({ email, password });
          if(error) throw error;
          const prof = await ensureUserProfileAndStatus(data.user);
          if(!prof){
            errEl.textContent = authBannerMessage || "الحساب موقوف مؤقتاً.";
            btn.disabled = false;
            return;
          }
          dlg.close();
          toast("تم تسجيل الدخول بنجاح");
          render();
        } else {
          const fullName = (document.getElementById("authName")?.value || "").trim();
          const phone = (document.getElementById("authPhone")?.value || "").trim();
          const city = (document.getElementById("authCity")?.value || "البيضاء").trim();
          const { data, error } = await client.auth.signUp({
            email,
            password,
            options: { data: { full_name: fullName, role: "user" } }
          });
          if(error) throw error;
          if(data.user && data.session){
            await client.from("profiles").upsert({
              id: data.user.id,
              full_name: fullName || "مستخدم",
              phone,
              city,
              role: "user",
              is_active: true
            }, { onConflict: "id" });
            await ensureUserProfileAndStatus(data.user);
            dlg.close();
            toast("تم إنشاء الحساب وتسجيل الدخول");
            render();
          } else {
            errEl.style.color = "var(--ok)";
            errEl.textContent = "تم إنشاء الحساب! تحقق من بريدك الإلكتروني لتأكيد الحساب ثم سجّل الدخول.";
            btn.disabled = false;
          }
        }
      }catch(e){
        errEl.style.color = "var(--bad)";
        errEl.textContent = e?.message || "تعذر إتمام العملية، تحقق من البيانات.";
        btn.disabled = false;
      }
    };
  };

  paint();
  dlg.showModal();
}

function mergeById(existingList = [], incomingList = []){
  const map = new Map();
  existingList.forEach(item => {
    if(item && item.id != null) map.set(Number(item.id), item);
  });
  incomingList.forEach(item => {
    if(item && item.id != null){
      const id = Number(item.id);
      const prev = map.get(id);
      map.set(id, prev ? { ...prev, ...item } : item);
    }
  });
  return [...map.values()].sort((a, b) => Number(a.id) - Number(b.id));
}

function notifyUserIncomingUpdates(){
  if(!hasInitialSyncCompleted){
    seenMsgIds = new Set((db.messages || []).map(x => Number(x.id)));
    seenOrderStatuses = new Map((db.orders || []).map(o => [Number(o.id), o.status]));
    hasInitialSyncCompleted = true;
    return;
  }

  let newProMsgs = 0;
  let lastProName = "";
  (db.messages || []).forEach(msg => {
    const mid = Number(msg.id);
    if(!seenMsgIds.has(mid)){
      seenMsgIds.add(mid);
      if(msg.sender === "pro"){
        newProMsgs++;
        const pr = db.pros.find(p => Number(p.id) === Number(msg.proId));
        lastProName = pr?.name || "حرفي";
      }
    }
  });

  if(newProMsgs > 0){
    if(ui.tab !== "chat") unreadIncomingMsgs += newProMsgs;
    toast(newProMsgs === 1
      ? `رد جديد من ${lastProName}`
      : `وصلك ${newProMsgs} ردود جديدة من الحرفيين`);
  }

  let statusChanges = 0;
  (db.orders || []).forEach(o => {
    const oid = Number(o.id);
    const prevStatus = seenOrderStatuses.get(oid);
    if(prevStatus !== undefined && prevStatus !== o.status){
      statusChanges++;
    }
    seenOrderStatuses.set(oid, o.status);
  });

  if(statusChanges > 0){
    if(ui.tab !== "orders") unreadOrderUpdates += statusChanges;
    toast("تم تحديث حالة أحد طلباتك");
  }
}

async function syncFromSupabase(showToastOnConnect=false){
  const client = initSupabaseClient();
  if(!client) return false;
  try{
    const [sRes, pRes, jRes, oRes, mRes, rRes, tRes, wRes] = await Promise.all([
      client.from("app_settings").select("*").eq("id", 1).maybeSingle(),
      client.from("pros").select("*").order("id", { ascending: true }),
      client.from("join_requests").select("*").order("id", { ascending: true }),
      client.from("orders").select("*").order("id", { ascending: true }),
      client.from("messages").select("*").order("id", { ascending: true }),
      client.from("reviews").select("*").order("id", { ascending: true }),
      client.from("transactions").select("*").order("id", { ascending: true }),
      client.from("withdrawals").select("*").order("id", { ascending: true })
    ]);
    if(pRes.error) throw pRes.error;

    const current = loadDB();
    const next = { ...current };

    if(sRes.data){
      next.commissionRate = Number(sRes.data.commission_rate ?? next.commissionRate);
      next.paymentSettings = {
        cashEnabled: sRes.data.cash_enabled !== false,
        transferEnabled: sRes.data.transfer_enabled !== false,
        bankName: sRes.data.bank_name || next.paymentSettings.bankName,
        accountNumber: sRes.data.account_number || next.paymentSettings.accountNumber,
        accountHolder: sRes.data.account_holder || next.paymentSettings.accountHolder
      };
    }
    if(Array.isArray(pRes.data) && pRes.data.length) next.pros = mergeById(current.pros, pRes.data.map(mapProFromRow));
    if(Array.isArray(jRes.data)) next.joinRequests = mergeById(current.joinRequests, jRes.data.map(mapJoinFromRow));
    if(Array.isArray(oRes.data)) next.orders = mergeById(current.orders, oRes.data.map(mapOrderFromRow));
    if(Array.isArray(mRes.data)) next.messages = mergeById(current.messages, mRes.data.map(mapMsgFromRow));
    if(Array.isArray(rRes.data)) next.reviews = mergeById(current.reviews, rRes.data.map(mapReviewFromRow));
    if(Array.isArray(tRes.data)) next.transactions = mergeById(current.transactions, tRes.data.map(mapTxFromRow));
    if(Array.isArray(wRes.data)) next.withdrawals = mergeById(current.withdrawals, wRes.data.map(mapWdFromRow));

    db = next;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){}
    notifyUserIncomingUpdates();
    const firstConnect = !sbConnected;
    sbConnected = true;
    render();
    if(showToastOnConnect && firstConnect) toast("متصل بقاعدة بيانات Supabase");
    return true;
  }catch(err){
    console.warn("User sync fallback:", err?.message || err);
    return false;
  }
}

async function pushStateToSupabase(){
  const client = initSupabaseClient();
  if(!client || sbSyncing) return;
  sbSyncing = true;
  try{
    const ps = db.paymentSettings || {};
    await Promise.all([
      client.from("app_settings").upsert({
        id: 1,
        commission_rate: Number(db.commissionRate ?? 10),
        cash_enabled: ps.cashEnabled !== false,
        transfer_enabled: ps.transferEnabled !== false,
        bank_name: ps.bankName || "",
        account_number: ps.accountNumber || "",
        account_holder: ps.accountHolder || ""
      }, { onConflict: "id" }),
      db.pros.length ? client.from("pros").upsert(db.pros.map(mapProToRow), { onConflict: "id" }) : Promise.resolve(),
      db.joinRequests.length ? client.from("join_requests").upsert(db.joinRequests.map(mapJoinToRow), { onConflict: "id" }) : Promise.resolve(),
      db.orders.length ? client.from("orders").upsert(db.orders.map(mapOrderToRow), { onConflict: "id" }) : Promise.resolve(),
      db.messages.length ? client.from("messages").upsert(db.messages.map(mapMsgToRow), { onConflict: "id" }) : Promise.resolve(),
      db.reviews.length ? client.from("reviews").upsert(db.reviews.map(mapReviewToRow), { onConflict: "id" }) : Promise.resolve(),
      db.transactions.length ? client.from("transactions").upsert(db.transactions.map(mapTxToRow), { onConflict: "id" }) : Promise.resolve(),
      db.withdrawals.length ? client.from("withdrawals").upsert(db.withdrawals.map(mapWdToRow), { onConflict: "id" }) : Promise.resolve()
    ]);
  }catch(err){
    console.warn("User push error:", err?.message || err);
  }finally{
    sbSyncing = false;
  }
}

function subscribeSupabaseRealtime(){
  const client = initSupabaseClient();
  if(!client || client._akhdimliUserRealtimeBound) return;
  client._akhdimliUserRealtimeBound = true;
  const tables = ["app_settings","pros","join_requests","orders","messages","reviews","transactions","withdrawals"];
  const ch = client.channel("akhdimli-user-live-db");
  tables.forEach(tbl => {
    ch.on("postgres_changes", { event: "*", schema: "public", table: tbl }, ()=>{
      if(sbSyncing) return;
      clearTimeout(sbReloadTimer);
      sbReloadTimer = setTimeout(()=>syncFromSupabase(false), 180);
    });
  });
  ch.subscribe();
}

  if(!clean) return false;
  const newId = Date.now() + Math.floor(Math.random()*100);
  seenMsgIds.add(newId);
  db.messages.push({
    id: newId,
    proId,
    userId: currentAuthUser?.id || "",
    customerPhone: customerPhone || db.userProfile.phone || "",
    customerName: customerName || db.userProfile.name || "عميل",
    sender,
    text: clean,
    time: nowTime()
  });
  saveDB();
  return true;
}

  m.innerHTML = "";

    m.insertAdjacentHTML("beforeend",`
      <div class="card" style="border-color:var(--bad)">

            <div class="av">${specIcon(p.spec,25)}</div>
            <div>
              <h3>
                ${p.name}
                ${p.verified ? `<span class="badge ok">موثّق ✓</span>` : ""}
                <span class="badge ${p.available!==false?"ok":""}">${p.available!==false?"متاح":"مشغول"}</span>
              </h3>
              <div class="sub">${p.spec} • ${p.city} • <span class="rating">★ ${p.rating||5}</span> (${p.jobs||0} عمل) • <b>${p.price}</b></div>
            </div>
          </div>
          <p class="desc">${p.desc}</p>
          <div class="row">
            <button class="btn main" data-ord="${p.id}">طلب خدمة</button>
            <button class="btn" data-cht="${p.id}">مراسلة</button>
          </div>
        `;
        card.querySelector("[data-ord]").onclick = ()=>openOrderModal(p);
        card.querySelector("[data-cht]").onclick = ()=>{
          ui.activeChatProId = Number(p.id);
          ui.tab = "chat";
          render();
        };
        listWrap.append(card);
      });
    }
    renderList();
  }

  if(ui.tab === "orders"){
    const allOrders = db.orders || [];
    const uPh = normalizePhone(db.userProfile.phone);
    let myOrders = allOrders.filter(o => {
      if(currentAuthUser?.id && o.userId === currentAuthUser.id) return true;
      if(uPh && normalizePhone(o.customerPhone) === uPh) return true;
      return !o.userId;
    });
    if(!myOrders.length) myOrders = allOrders;

    if(!myOrders.length){
      m.innerHTML = `<div class="empty"><b>لا توجد طلبات بعد</b>اطلب خدمة من الصفحة الرئيسية لتظهر هنا وتتابع حالتها.</div>`;
    } else {
      [...myOrders].reverse().forEach(o=>{
        const pr = db.pros.find(x => Number(x.id) === Number(o.proId));
        const cls = o.status === "مكتمل" ? "ok" : o.status === "ملغي" ? "bad" : "";
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="top">
            <div class="av">${specIcon(pr?.spec || "سباكة",24)}</div>
            <div>
              <h3>${pr ? pr.name : "حرفي #" + o.proId} <span class="sub">(${pr?.spec || ""})</span></h3>
              <div class="sub">${o.city || pr?.city || ""} • <b>${o.amount} د.ل</b> • ${o.paymentMethod} ${o.date ? "• " + o.date : ""}</div>
            </div>
            <span class="badge ${cls}" style="margin-inline-start:auto">${o.status}</span>
          </div>
          <p class="desc">${o.desc}</p>
          ${o.ratingGiven > 0 ? `<div class="sub" style="margin-bottom:8px">تقييمك: <b style="color:var(--acc)">★ ${o.ratingGiven}</b> ${o.reviewText ? "— " + o.reviewText : ""}</div>` : ""}
          <div class="row">
            ${o.status === "مكتمل" && !o.ratingGiven ? `<button class="btn main sm" data-rev="${o.id}">تقييم الخدمة</button>` : ""}
            <button class="btn sm" data-cht="${o.proId}">مراسلة الحرفي</button>
          </div>
        `;
        if(card.querySelector("[data-rev]")){
          card.querySelector("[data-rev]").onclick = ()=>openReviewModal(o, pr);
        }
        card.querySelector("[data-cht]").onclick = ()=>{
          ui.activeChatProId = Number(o.proId);
          ui.tab = "chat";
          render();
        };
        m.append(card);
      });
    }
  }

  if(ui.tab === "chat"){
    const proList = activePros.length ? activePros : db.pros;
    const pro = proList.find(p => Number(p.id) === Number(ui.activeChatProId)) || proList[0];
    if(!pro){
      m.innerHTML = `<div class="empty"><b>لا يوجد حرفيون متاحون للمحادثة</b></div>`;
    } else {
      ui.activeChatProId = Number(pro.id);
      const chatMsgs = (db.messages || []).filter(msg => Number(msg.proId) === Number(pro.id));

      m.innerHTML = `
        <div class="chat-box">
          <div class="chat-head">
            <div class="av" style="width:38px;height:38px">${specIcon(pro.spec,20)}</div>
            <div style="flex:1;min-width:0">
              <b>${pro.name}</b>
              <div class="sub">${pro.spec} • ${pro.city}</div>
            </div>
            <select id="chatProSelect" style="width:auto;padding:5px 8px;font-size:12.5px" aria-label="اختر حرفياً">
              ${proList.map(p=>`<option value="${p.id}" ${Number(p.id)===Number(pro.id)?"selected":""}>${p.name} (${p.spec})</option>`).join("")}
            </select>
          </div>
          <div class="chat-msgs" id="chatMsgs">
            ${chatMsgs.length ? chatMsgs.map(msg => `
              <div class="msg ${msg.sender === "user" ? "me" : "them"}">
                <div>${msg.text}</div>
                <div class="msg-meta">
                  <span>${msg.sender === "user" ? (msg.customerName || db.userProfile.name || "أنت") : pro.name}</span>
                  <span>${msg.time}</span>
                </div>
              </div>
            `).join("") : `<div class="empty"><b>ابدأ المحادثة مع ${pro.name}</b>اسأل عن المواعيد أو تفاصيل الخدمة.</div>`}
          </div>
          <form class="chat-form" id="chatForm">
            <input id="chatInput" placeholder="اكتب رسالتك..." autocomplete="off">
            <button class="btn main sm" type="submit" aria-label="إرسال">${svgIcon("send",18)}</button>
          </form>
        </div>
      `;

      const box = document.getElementById("chatMsgs");
      box.scrollTop = box.scrollHeight;

      document.getElementById("chatProSelect").onchange = e => {
        ui.activeChatProId = Number(e.target.value);
        render();
      };
      document.getElementById("chatForm").onsubmit = e => {
        e.preventDefault();
        const inp = document.getElementById("chatInput");
        if(sendMsg({
          proId: pro.id,
          customerPhone: db.userProfile.phone || "",
          customerName: db.userProfile.name || "عميل",
          sender: "user",
          text: inp.value
        })){
          inp.value = "";
          render();
        }
      };
    }
  }

  if(ui.tab === "profile"){
    m.innerHTML = `
      <div class="card">
        <div class="top">
          <div class="av">${svgIcon("user",24)}</div>
          <div>
            <h3>حساب المستخدم</h3>
            <div class="sub">${currentAuthUser ? (currentAuthUser.email || "") : "غير مسجل الدخول بالبريد الإلكتروني"}</div>
          </div>
          <span class="badge ${currentAuthUser?"ok":""}" style="margin-inline-start:auto">${currentAuthUser?"مسجّل الدخول":"وضع محلي"}</span>
        </div>
        <div class="row" style="margin-top:12px">
          ${currentAuthUser
            ? `<button type="button" class="btn bad sm" id="logoutUserBtn">تسجيل الخروج</button>`
            : `<button type="button" class="btn main sm" id="openUserLoginBtn">تسجيل الدخول</button>
               <button type="button" class="btn sm" id="openUserSignupBtn">حساب جديد</button>`
          }
        </div>
      </div>

      <div class="card">
        <h3 style="margin:0 0 4px">بياناتي للتواصل والطلبات</h3>
        <label>الاسم الكامل</label>
        <input id="uName" value="${db.userProfile.name||""}" placeholder="اكتب اسمك">
        <label>رقم الهاتف</label>
        <input id="uPhone" value="${db.userProfile.phone||""}" placeholder="091...">
        <label>المدينة</label>
        <input id="uCity" value="${db.userProfile.city||"البيضاء"}">
        <label>العنوان</label>
        <input id="uAddr" value="${db.userProfile.address||""}" placeholder="الحي / الشارع">
        <div style="margin-top:14px">
          <button type="button" class="btn main" id="saveUserBtn" style="width:100%">حفظ بياناتي</button>
        </div>
      </div>
    `;

    if(document.getElementById("logoutUserBtn")) document.getElementById("logoutUserBtn").onclick = logoutUser;
    if(document.getElementById("openUserLoginBtn")) document.getElementById("openUserLoginBtn").onclick = ()=>openAuthModal("login");
    if(document.getElementById("openUserSignupBtn")) document.getElementById("openUserSignupBtn").onclick = ()=>openAuthModal("signup");

    document.getElementById("saveUserBtn").onclick = async ()=>{
      db.userProfile.name = document.getElementById("uName").value.trim();
      db.userProfile.phone = document.getElementById("uPhone").value.trim();
      db.userProfile.city = document.getElementById("uCity").value.trim() || "البيضاء";
      db.userProfile.address = document.getElementById("uAddr").value.trim();
      saveDB();

      const client = initSupabaseClient();
      if(client && currentAuthUser){
        await client.from("profiles").upsert({
          id: currentAuthUser.id,
          full_name: db.userProfile.name,
          phone: db.userProfile.phone,
          city: db.userProfile.city,
          role: currentAuthProfile?.role || "user",
          is_active: currentAuthProfile?.is_active !== false
        }, { onConflict: "id" });
      }
      toast("تم حفظ بياناتك");
      render();
    };
  }

  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  [
    ["home","home","الرئيسية",0],
    ["orders","list","طلباتي",unreadOrderUpdates],
    ["chat","chat","الرسائل",unreadIncomingMsgs],
    ["profile","user","حسابي",0]
  ].forEach(([k,ic,l,cnt])=>{
    const b = document.createElement("button");
    b.innerHTML = `${cnt>0?`<span class="nav-cnt">${cnt}</span>`:""}${svgIcon(ic,23)}${l}`;
    if(ui.tab === k) b.setAttribute("aria-current","page");
    b.onclick = ()=>{
      ui.tab = k;
      if(k === "orders") unreadOrderUpdates = 0;
      if(k === "chat") unreadIncomingMsgs = 0;
      render();
      window.scrollTo(0,0);
    };
    nav.append(b);
  });
}

initAuthListener();
render();
subscribeSupabaseRealtime();
syncFromSupabase(true);
</script></body></html>
