<style>
:root{
  --bg:#EEF4F4;--card:#fff;--ink:#12292D;--mut:#5B7276;
  --pri:#0B6B76;--pri2:#095560;--on:#fff;--acc:#F59E0B;
  --line:#D5E2E3;--ok:#157347;--bad:#B3261E;--adm:#1E293B;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1C1F;--card:#15292D;--ink:#E7F1F2;--mut:#93ABAF;
    --pri:#2BB3C0;--pri2:#5CCAD5;--on:#06262A;--line:#254247;
    --ok:#5BD48A;--bad:#FF8A80;--adm:#334155;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1C1F;--card:#15292D;--ink:#E7F1F2;--mut:#93ABAF;
  --pri:#2BB3C0;--pri2:#5CCAD5;--on:#06262A;--line:#254247;
  --ok:#5BD48A;--bad:#FF8A80;--adm:#334155;

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Cairo,Tahoma,Arial,sans-serif;font-size:15.5px;line-height:1.6;
  padding-bottom:88px;
}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--card);
  border-bottom:1px solid var(--line);padding:12px 16px;
}
.topbar-in{
  max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(180deg,#334155,#0F172A);
  display:grid;place-items:center;flex:none;
}
.brand b{display:block;font-size:19px;font-weight:800;line-height:1.15}
.brand small{color:var(--mut);font-size:12.5px}
.icon-btn{
  margin-inline-start:auto;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;flex:none;padding:0;
}
main{max-width:680px;margin:0 auto;padding:14px 16px 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat small{color:var(--mut);font-size:12.5px;display:block}
.stat b{font-size:22px;font-weight:800;line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.top{display:flex;gap:12px;align-items:center}
.av{
  width:48px;height:48px;border-radius:50%;
  background:color-mix(in srgb,var(--pri) 15%,var(--card));
  color:var(--pri2);display:grid;place-items:center;flex:none;
}
.top h3{margin:0;font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ver-ic{color:var(--pri2);display:inline-flex;align-items:center}
.sub{color:var(--mut);font-size:13px}
.rate{margin-inline-start:auto;font-weight:800;font-size:14px;white-space:nowrap}
.rate b{color:var(--acc)}
.desc{margin:10px 0 12px;font-size:14.5px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  flex:1;min-width:95px;text-align:center;text-decoration:none;font:inherit;
  font-weight:700;font-size:13.5px;border-radius:11px;padding:9px 12px;
  border:1.5px solid var(--pri);color:var(--pri2);background:transparent;cursor:pointer;
}
.btn.main{background:var(--pri);color:var(--on)}
.btn.adm{background:var(--adm);border-color:var(--adm);color:#fff}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{flex:0 0 auto;min-width:auto;padding:6px 11px;font-size:12.5px}
.badge{
  font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;
  background:color-mix(in srgb,var(--acc) 22%,var(--card));white-space:nowrap;
}
.badge.ok{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ok)}
.badge.bad{background:color-mix(in srgb,var(--bad) 18%,var(--card));color:var(--bad)}
.pay-box{
  background:color-mix(in srgb,var(--pri) 8%,var(--card));
  border:1px dashed var(--pri);border-radius:12px;padding:11px 12px;margin-top:10px;font-size:13.5px;
}
.search-row{display:flex;gap:8px;margin-bottom:10px}
input,textarea,select{
  width:100%;font:inherit;color:var(--ink);background:var(--card);
  border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;
}
.search-row select{width:auto;min-width:130px;flex:none}
label{display:block;font-weight:700;font-size:13.5px;margin:10px 0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chip{
  flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:5px 13px;font:inherit;font-size:13.5px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
}
.chip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--on)}
.hero{
  background:linear-gradient(135deg,#0B6B76,#09444D);color:#fff;
  border-radius:18px;padding:18px;margin-bottom:12px;
}
.hero b{display:block;font-size:30px;font-weight:800;line-height:1.25}
.empty{text-align:center;color:var(--mut);padding:36px 16px}
.empty b{display:block;color:var(--ink);font-size:16.5px;margin-bottom:4px}

.stars-picker{display:flex;gap:6px;margin:8px 0}
.star-btn{
  border:1.5px solid var(--line);background:var(--card);color:var(--mut);
  border-radius:10px;padding:6px 12px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;

.star-btn.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--card));color:var(--acc)}
.review-item{
  border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font-size:13.5px;
}
.tx-row{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;
}
.tx-row:last-child{border-bottom:0}

.chat-box{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  display:flex;flex-direction:column;height:calc(100vh - 185px);min-height:360px;overflow:hidden;
}
.chat-head{
  padding:10px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;background:var(--card);
}
.chat-msgs{
  flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;
  background:color-mix(in srgb,var(--bg) 55%,transparent);
}
.msg{
  max-width:80%;padding:9px 13px;border-radius:14px;font-size:14.5px;line-height:1.5;
  word-wrap:break-word;
}
.msg.me{
  align-self:flex-start;background:var(--pri);color:var(--on);
  border-bottom-right-radius:4px;
}
.msg.them{
  align-self:flex-end;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-bottom-left-radius:4px;
}
.msg-meta{font-size:11px;opacity:.75;margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.chat-form{
  padding:10px;border-top:1px solid var(--line);background:var(--card);
  display:flex;gap:8px;align-items:center;
}
.chat-form input{flex:1;padding:9px 12px}

nav{
  position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20;
}
nav button{
  flex:1;border:0;background:none;font:inherit;font-size:12px;

nav button svg{display:block;margin:0 auto 3px}
nav button[aria-current="page"]{color:var(--pri2);font-weight:800}
.nav-cnt{

  min-width:17px;height:17px;padding:0 4px;border-radius:999px;
  background:var(--acc);color:#12292D;font-size:10.5px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;line-height:1;
}
dialog{
  width:min(92vw,460px);border:0;border-radius:18px;padding:18px;
  background:var(--card);color:var(--ink);
}
dialog::backdrop{background:rgba(0,0,0,.5)}
#toast{
  position:fixed;inset-inline:16px;bottom:84px;margin:auto;max-width:360px;
  background:var(--ink);color:var(--bg);text-align:center;border-radius:12px;
  padding:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:50;
}
#toast.on{opacity:1}

.lock-screen{
  max-width:420px;margin:32px auto;background:var(--card);
  border:1px solid var(--line);border-radius:18px;padding:20px;
}
.lock-err{
  color:var(--bad);font-size:13px;font-weight:700;margin-top:8px;min-height:20px;
}
</style>
</head>

function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);

    if(!parsed.messages) parsed.messages = structuredClone(DEFAULT_DATA.messages);

    if(!parsed.userProfile) parsed.userProfile = structuredClone(DEFAULT_DATA.userProfile);
    if(!parsed.reviews) parsed.reviews = structuredClone(DEFAULT_DATA.reviews);
    if(!parsed.transactions) parsed.transactions = structuredClone(DEFAULT_DATA.transactions);

    parsed.orders = (parsed.orders || []).map(o => ({ ratingGiven: 0, reviewText: "", ...o }));
    return parsed;
  }catch(e){
    return structuredClone(DEFAULT_DATA);
  }
}

  if(!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase?.createClient) return null;
  if(!sbClient){
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
  }
  return sbClient;
}

async function seedInitialCloudIfEmpty(client){
  const { data: existingPros, error: pErr } = await client.from("pros").select("id").limit(1);
  if(pErr || (existingPros && existingPros.length > 0)) return;
  await client.from("pros").upsert(DEFAULT_DATA.pros.map(mapProToRow), { onConflict: "id" });
  await client.from("join_requests").upsert(DEFAULT_DATA.joinRequests.map(mapJoinToRow), { onConflict: "id" });
  await client.from("orders").upsert(DEFAULT_DATA.orders.map(mapOrderToRow), { onConflict: "id" });
  await client.from("messages").upsert(DEFAULT_DATA.messages.map(mapMsgToRow), { onConflict: "id" });
  await client.from("reviews").upsert(DEFAULT_DATA.reviews.map(mapReviewToRow), { onConflict: "id" });
  await client.from("transactions").upsert(DEFAULT_DATA.transactions.map(mapTxToRow), { onConflict: "id" });
}

async function syncFromSupabase(showToastOnConnect=false){
  const client = initSupabaseClient();
  if(!client) return false;
  try{
    await seedInitialCloudIfEmpty(client);
    const [sRes, pRes, jRes, oRes, mRes, rRes, tRes, wRes] = await Promise.all([
      client.from("app_settings").select("*").eq("id", 1).maybeSingle(),
      client.from("pros").select("*").order("id", { ascending: true }),
      client.from("join_requests").select("*").order("id", { ascending: true }),
      client.from("orders").select("*").order("id", { ascending: true }),
      client.from("messages").select("*").order("id", { ascending: true }),
      client.from("reviews").select("*").order("id", { ascending: true }),
      client.from("transactions").select("*").order("id", { ascending: true }),
      client.from("withdrawals").select("*").order("id", { ascending: true })
    ]);
    if(pRes.error) throw pRes.error;

    const next = loadDB();
    if(sRes.data){
      next.commissionRate = Number(sRes.data.commission_rate ?? next.commissionRate);
      next.paymentSettings = {
        cashEnabled: sRes.data.cash_enabled !== false,
        transferEnabled: sRes.data.transfer_enabled !== false,
        bankName: sRes.data.bank_name || next.paymentSettings.bankName,
        accountNumber: sRes.data.account_number || next.paymentSettings.accountNumber,
        accountHolder: sRes.data.account_holder || next.paymentSettings.accountHolder
      };
    }
    if(Array.isArray(pRes.data)) next.pros = pRes.data.map(mapProFromRow);
    if(Array.isArray(jRes.data)) next.joinRequests = jRes.data.map(mapJoinFromRow);
    if(Array.isArray(oRes.data)) next.orders = oRes.data.map(mapOrderFromRow);
    if(Array.isArray(mRes.data)) next.messages = mRes.data.map(mapMsgFromRow);
    if(Array.isArray(rRes.data)) next.reviews = rRes.data.map(mapReviewFromRow);
    if(Array.isArray(tRes.data)) next.transactions = tRes.data.map(mapTxFromRow);
    if(Array.isArray(wRes.data)) next.withdrawals = wRes.data.map(mapWdFromRow);

    db = next;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){}
    const firstConnect = !sbConnected;
    sbConnected = true;
    render();
    if(showToastOnConnect && firstConnect) toast("متصل بقاعدة بيانات Supabase");
    return true;
  }catch(err){
    console.warn("Supabase sync fallback:", err?.message || err);
    return false;
  }
}

async function pushStateToSupabase(){
  const client = initSupabaseClient();
  if(!client || sbSyncing) return;
  sbSyncing = true;
  try{
    const ps = db.paymentSettings || {};
    await Promise.all([
      client.from("app_settings").upsert({
        id: 1,
        commission_rate: Number(db.commissionRate ?? 10),
        cash_enabled: ps.cashEnabled !== false,
        transfer_enabled: ps.transferEnabled !== false,
        bank_name: ps.bankName || "",
        account_number: ps.accountNumber || "",
        account_holder: ps.accountHolder || ""
      }, { onConflict: "id" }),
      db.pros.length ? client.from("pros").upsert(db.pros.map(mapProToRow), { onConflict: "id" }) : Promise.resolve(),
      db.joinRequests.length ? client.from("join_requests").upsert(db.joinRequests.map(mapJoinToRow), { onConflict: "id" }) : Promise.resolve(),
      db.orders.length ? client.from("orders").upsert(db.orders.map(mapOrderToRow), { onConflict: "id" }) : Promise.resolve(),
      db.messages.length ? client.from("messages").upsert(db.messages.map(mapMsgToRow), { onConflict: "id" }) : Promise.resolve(),
      db.reviews.length ? client.from("reviews").upsert(db.reviews.map(mapReviewToRow), { onConflict: "id" }) : Promise.resolve(),
      db.transactions.length ? client.from("transactions").upsert(db.transactions.map(mapTxToRow), { onConflict: "id" }) : Promise.resolve(),
      db.withdrawals.length ? client.from("withdrawals").upsert(db.withdrawals.map(mapWdToRow), { onConflict: "id" }) : Promise.resolve()
    ]);
  }catch(err){
    console.warn("Supabase push error:", err?.message || err);
  }finally{
    sbSyncing = false;
  }
}

function subscribeSupabaseRealtime(){
  const client = initSupabaseClient();
  if(!client || client._akhdimliRealtimeBound) return;
  client._akhdimliRealtimeBound = true;
  const tables = ["app_settings","pros","join_requests","orders","messages","reviews","transactions","withdrawals"];
  const ch = client.channel("akhdimli-live-db");
  tables.forEach(tbl => {
    ch.on("postgres_changes", { event: "*", schema: "public", table: tbl }, ()=>{
      if(sbSyncing) return;
      clearTimeout(sbReloadTimer);
      sbReloadTimer = setTimeout(()=>syncFromSupabase(false), 180);
    });
  });
  ch.subscribe();
}

function saveDB(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){}
  pushStateToSupabase();
}

window.addEventListener("storage", (e)=>{

let themeMode = "auto";
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  setTimeout(()=>t.classList.remove("on"), 2200);
}
function updateThemeIcon(){
  const isDark = themeMode === "dark" || (themeMode === "auto" && window.matchMedia("(prefers-color-scheme:dark)").matches);
  document.getElementById("themeBtn").innerHTML = svgIcon(isDark ? "sun" : "moon", 18);
}
function toggleTheme(){
  const isDark = themeMode === "dark" || (themeMode === "auto" && window.matchMedia("(prefers-color-scheme:dark)").matches);
  themeMode = isDark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", themeMode);
  updateThemeIcon();
}
function confirmAction({title="تأكيد الإجراء", message="هل أنت متأكد من تنفيذ هذا الإجراء؟", confirmText="تأكيد", danger=false}){
  return new Promise(resolve=>{
    const dlg = document.getElementById("dlg");
    dlg.innerHTML = `
      <h2 style="margin:0 0 6px">${title}</h2>
      <div class="desc" style="margin:6px 0 14px">${message}</div>
      <div class="row">
        <button type="button" class="btn" id="cfCancel">تراجع</button>
        <button type="button" class="btn ${danger?"bad":"main"}" id="cfOk">${confirmText}</button>
      </div>
    `;
    dlg.showModal();
    let done = false;
    const finish = (val)=>{
      if(done) return;
      done = true;
      dlg.close();
      resolve(val);
    };
    document.getElementById("cfCancel").onclick = ()=>finish(false);
    document.getElementById("cfOk").onclick = ()=>finish(true);
    dlg.oncancel = ()=>finish(false);
  });
}
function getPro(id){
  return db.pros.find(p => p.id === id) || {name:"حرفي",spec:"عام",city:"",phone:"",price:"",available:true,rating:4.5,jobs:0,balance:0};
}
function intlPhone(n){
  n = (n||"").replace(/\D/g,"");
  if(n.startsWith("00")) n = n.slice(2);
  if(n.startsWith("0")) n = "218" + n.slice(1);
  return n;
}
function waLink(ph, msg){
  return "https://wa.me/" + intlPhone(ph) + (msg ? "?text=" + encodeURIComponent(msg) : "");
}
function nowTime(){
  const d = new Date();
  return d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
}
function sendMsg({proId, customerPhone, customerName, sender, text}){
  const clean = (text||"").trim();
  if(!clean) return false;
  db.messages.push({
    id: Date.now() + Math.floor(Math.random()*100),
    proId,
    customerPhone: customerPhone || db.userProfile.phone || "0910000000",
    customerName: customerName || db.userProfile.name || "مستخدم",
    sender,
    text: clean,
    time: nowTime()
  });
  saveDB();
  return true;
}
function completeOrderAndCredit(order, pro){
  if(order.status === "مكتمل") return;
  order.status = "مكتمل";
  order.paid = true;
  pro.jobs = (pro.jobs || 0) + 1;
  const net = Math.round((Number(order.amount) || 0) * (1 - db.commissionRate/100));
  pro.balance = (pro.balance || 0) + net;
  db.transactions.push({
    id: Date.now() + Math.floor(Math.random()*90),
    proId: pro.id,
    title: "إتمام طلب #" + order.id + " (" + order.customerName + ")",
    amount: net,
    type: "credit",
    time: nowTime()
  });
}
function addProReview(pro, customerName, stars, comment){
  const cleanStars = Math.max(1, Math.min(5, Number(stars) || 5));
  db.reviews.push({
    id: Date.now() + Math.floor(Math.random()*90),
    proId: pro.id,
    customerName: customerName || "عميل",
    stars: cleanStars,
    comment: (comment || "").trim(),
    date: new Date().toISOString().slice(0,10)
  });
  const proReviews = db.reviews.filter(r => r.proId === pro.id);
  const sum = proReviews.reduce((s, r) => s + Number(r.stars), 0);
  pro.rating = Number((sum / proReviews.length).toFixed(1));
}


const ADMIN_PASSCODE = "5715066";
const ADMIN_AUTH_KEY = "akhdimli_admin_auth_v1";

function isAdminUnlocked(){
  try{ return sessionStorage.getItem(ADMIN_AUTH_KEY) === "1"; }catch(e){ return false; }
}

function setAdminUnlocked(val){
  try{
    if(val) sessionStorage.setItem(ADMIN_AUTH_KEY, "1");
    else sessionStorage.removeItem(ADMIN_AUTH_KEY);
  }catch(e){}
}

function lockAdminSession(){
  setAdminUnlocked(false);
  toast("تم قفل لوحة الإدارة");
  render();
}

function bindAdminLockScreen(){
  const lockEl = document.getElementById("adminLock");
  const mainEl = document.getElementById("main");
  const navEl = document.getElementById("nav");
  const lockBtn = document.getElementById("lockAdminBtn");
  const unlocked = isAdminUnlocked();

  if(lockEl) lockEl.style.display = unlocked ? "none" : "block";
  if(mainEl) mainEl.style.display = unlocked ? "block" : "none";
  if(navEl) navEl.style.display = unlocked ? "flex" : "none";
  if(lockBtn) lockBtn.style.display = unlocked ? "grid" : "none";

  if(unlocked) return false;

  const inp = document.getElementById("adminPassInput");
  const errEl = document.getElementById("adminLockErr");
  const btn = document.getElementById("adminUnlockBtn");

  const attempt = ()=>{
    const val = (inp?.value || "").trim();
    if(val === ADMIN_PASSCODE){
      setAdminUnlocked(true);
      if(errEl) errEl.textContent = "";
      toast("تم فتح لوحة الإدارة");
      render();
    } else {
      if(errEl) errEl.textContent = "رمز الدخول غير صحيح، حاول مرة أخرى.";
      if(inp){ inp.value = ""; inp.focus(); }
    }
  };

  if(btn) btn.onclick = attempt;
  if(inp){
    inp.onkeydown = (e)=>{ if(e.key === "Enter"){ e.preventDefault(); attempt(); } };
    setTimeout(()=>inp.focus(), 50);
  }
  return true;
}

              title: "رفض طلب السحب",
              message: `رفض طلب السحب وإعادة مبلغ <b>${w.amount} د.ل</b> إلى رصيد <b>${w.proName || p.name}</b>؟`,
              confirmText: "رفض وإعادة الرصيد",
              danger: true
            });
            if(!ok) return;
            w.status = "مرفوض";
            const targetPro = db.pros.find(x => x.id === w.proId);
            if(targetPro) targetPro.balance = (targetPro.balance || 0) + Number(w.amount || 0);
            db.transactions.push({
              id: Date.now(),
              proId: w.proId,
              title: "إعادة رصيد طلب سحب مرفوض #" + w.id,
              amount: w.amount,
              type: "credit",
              time: nowTime()
            });
            saveDB(); toast("تم رفض الطلب وإعادة الرصيد"); render();
          };
        }
        m.append(card);
      });
    }
  }

  if(ui.tab === "requests"){
    if(!db.joinRequests.length){
      m.innerHTML = `<div class="empty"><b>لا توجد طلبات انضمام</b></div>`;
    } else {
      [...db.joinRequests].reverse().forEach(r=>{
        const cls = r.status === "مقبول" ? "ok" : r.status === "مرفوض" ? "bad" : "";
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="top">
            <div class="av">${specIcon(r.spec, 24)}</div>
            <div>
              <h3>${r.name} <span class="sub">• ${r.spec}</span></h3>
              <div class="sub">${r.city} • هاتف: ${r.phone}</div>
            </div>
            <span class="badge ${cls}" style="margin-inline-start:auto">${r.status}</span>
          </div>
          <p class="desc">${r.desc || "بدون نبذة"}</p>
          ${r.status === "قيد المراجعة" ? `
            <div class="row">
              <button class="btn main sm" data-app="${r.id}">اعتماد وإضافة للتطبيق</button>
              <button class="btn bad sm" data-rej="${r.id}">رفض</button>
            </div>
          ` : ""}
        `;
        if(card.querySelector("[data-app]")){
          card.querySelector("[data-app]").onclick = async ()=>{
            const ok = await confirmAction({
              title: "اعتماد طلب انضمام",
              message: `اعتماد <b>${r.name}</b> (${r.spec}) وإضافته إلى قائمة الحرفيين؟`,
              confirmText: "اعتماد الحساب"
            });
            if(!ok) return;
            r.status = "مقبول";
            db.pros.push({
              id: Date.now(), name: r.name, spec: r.spec, city: r.city,
              phone: r.phone, price: "حسب العمل", desc: r.desc,
              rating: 5.0, jobs: 0, verified: true, active: true, available: true, balance: 0
            });
            saveDB(); toast("تم اعتماد " + r.name); render();
          };
          card.querySelector("[data-rej]").onclick = async ()=>{
            const ok = await confirmAction({
              title: "رفض طلب الانضمام",
              message: `هل أنت متأكد من رفض طلب انضمام <b>${r.name}</b>؟`,
              confirmText: "رفض الطلب",
              danger: true
            });
            if(!ok) return;
            r.status = "مرفوض"; saveDB(); toast("تم رفض الطلب"); render();
          };
        }
        m.append(card);
      });
    }
  }

  if(ui.tab === "pros"){
    db.pros.forEach(p=>{
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="top">
          <div class="av">${specIcon(p.spec, 24)}</div>
          <div>
            <h3>${p.name} ${p.verified ? `<span class="ver-ic">${svgIcon("verified", 16)}</span>` : ""} <span class="sub">• ${p.spec} (${p.city})</span></h3>
            <div class="sub">هاتف: ${p.phone} • رصيد: ${p.balance || 0} د.ل • أعمال: ${p.jobs} • ★ ${p.rating} • ${p.available ? "متاح" : "مشغول"}</div>
          </div>
          <span class="badge ${p.active ? "ok" : "bad"}" style="margin-inline-start:auto">${p.active ? "نشط" : "موقوف"}</span>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="btn sm" data-ver="${p.id}">${p.verified ? "إلغاء التوثيق" : "توثيق الحساب"}</button>
          <button class="btn ${p.active ? "bad" : "main"} sm" data-tog="${p.id}">${p.active ? "إيقاف الحساب" : "تفعيل الحساب"}</button>
        </div>
      `;
      card.querySelector("[data-ver]").onclick = ()=>{
        p.verified = !p.verified; saveDB(); toast("تم تحديث حالة التوثيق"); render();
      };
      card.querySelector("[data-tog]").onclick = async ()=>{
        const nextActive = !p.active;
        if(!nextActive){
          const ok = await confirmAction({
            title: "إيقاف حساب الحرفي",
            message: `هل أنت متأكد من إيقاف حساب <b>${p.name}</b>؟ لن يظهر للعملاء أثناء الإيقاف.`,
            confirmText: "إيقاف الحساب",
            danger: true
          });
          if(!ok) return;
        }
        p.active = nextActive; saveDB(); toast(p.active ? "تم تفعيل الحساب" : "تم إيقاف الحساب"); render();
      };
      m.append(card);
    });
  }

  const pendingReqsCnt = db.joinRequests.filter(j=>j.status==="قيد المراجعة").length;
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  [
    ["overview","chart","الإحصائيات",0],
    ["withdrawals","wallet","السحب",pendingWithdrawalsCnt],
    ["requests","briefcase","الانضمام",pendingReqsCnt],
    ["pros","wrench","الحرفيون",0]
  ].forEach(([k,ic,l,cnt])=>{
    const b = document.createElement("button");
    b.innerHTML = `${cnt>0?`<span class="nav-cnt">${cnt}</span>`:""}${svgIcon(ic,22)}${l}`;
    if(ui.tab === k) b.setAttribute("aria-current","page");
    b.onclick = ()=>{ ui.tab = k; render(); window.scrollTo(0,0); };
    nav.append(b);
  });
}
render();
subscribeSupabaseRealtime();
syncFromSupabase(true);
</script></body></html>
