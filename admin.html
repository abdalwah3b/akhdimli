function confirmAction({title="تأكيد الإجراء", message="هل أنت متأكد من تنفيذ هذا الإجراء؟", confirmText="تأكيد", danger=false}){
  return new Promise(resolve=>{
    const dlg = document.getElementById("dlg");
    dlg.innerHTML = `
      <h2 style="margin:0 0 6px">${title}</h2>
      <div class="desc" style="margin:6px 0 14px">${message}</div>
      <div class="row">
        <button type="button" class="btn" id="cfCancel">تراجع</button>
        <button type="button" class="btn ${danger?"bad":"main"}" id="cfOk">${confirmText}</button>
      </div>
    `;
    dlg.showModal();
    let done = false;
    const finish = (val)=>{
      if(done) return;
      done = true;
      dlg.close();
      resolve(val);
    };
    document.getElementById("cfCancel").onclick = ()=>finish(false);
    document.getElementById("cfOk").onclick = ()=>finish(true);
    dlg.oncancel = ()=>finish(false);
  });
}

function initSupabaseClient(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase?.createClient) return null;
  if(!sbClient){
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
  }
  return sbClient;
}

async function checkAdminAccess(user){
  const client = initSupabaseClient();
  if(!client || !user){
    isAdminVerified = false;
    currentAuthProfile = null;
    return false;
  }
  try{
    const { data: prof, error } = await client
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();
    if(error) throw error;

    currentAuthUser = user;
    currentAuthProfile = prof;

    if(!prof || prof.role !== "admin" || prof.is_active === false){
      isAdminVerified = false;
      authErrorMsg = "هذا الحساب لا يملك صلاحية أدمن (role = admin) أو غير مفعل.";
      return false;
    }

    isAdminVerified = true;
    authErrorMsg = "";
    return true;
  }catch(e){
    isAdminVerified = false;
    authErrorMsg = e?.message || "تعذر التحقق من صلاحية الإدارة.";
    return false;
  }
}

function initAdminAuth(){
  const client = initSupabaseClient();
  if(!client || client._akhdimliAdminAuthBound) return;
  client._akhdimliAdminAuthBound = true;

  client.auth.getSession().then(async ({ data })=>{
    if(data?.session?.user){
      await checkAdminAccess(data.session.user);
      if(isAdminVerified) await syncFromSupabase(false);
      render();
    } else {
      render();
    }
  });

  client.auth.onAuthStateChange(async (event, session)=>{
    if(session?.user){
      await checkAdminAccess(session.user);
      if(isAdminVerified) await syncFromSupabase(false);
      render();
    } else if(event === "SIGNED_OUT"){
      currentAuthUser = null;
      currentAuthProfile = null;
      isAdminVerified = false;
      render();
    }
  });
}

async function loginAdmin(email, password){
  const client = initSupabaseClient();
  if(!client){ authErrorMsg = "تعذر الاتصال بـ Supabase."; render(); return; }
  authErrorMsg = "";
  const { data, error } = await client.auth.signInWithPassword({ email, password });
  if(error){
    authErrorMsg = error.message || "بيانات الدخول غير صحيحة.";
    render();
    return;
  }
  const ok = await checkAdminAccess(data.user);
  if(!ok){
    await client.auth.signOut();
    currentAuthUser = null;
    render();
    return;
  }
  toast("تم تسجيل دخول المدير بنجاح");
  await syncFromSupabase(false);
  render();
}

async function logoutAdmin(){
  const client = initSupabaseClient();
  if(client) await client.auth.signOut();
  currentAuthUser = null;
  currentAuthProfile = null;
  isAdminVerified = false;
  authErrorMsg = "";
  toast("تم تسجيل الخروج من لوحة الإدارة");
  render();
}

async function syncFromSupabase(showToastOnConnect=false){
  const client = initSupabaseClient();
  if(!client) return false;
  try{
    const [sRes, pRes, jRes, oRes, mRes, rRes, tRes, wRes] = await Promise.all([
      client.from("app_settings").select("*").eq("id", 1).maybeSingle(),
      client.from("pros").select("*").order("id", { ascending: true }),
      client.from("join_requests").select("*").order("id", { ascending: true }),
      client.from("orders").select("*").order("id", { ascending: true }),
      client.from("messages").select("*").order("id", { ascending: true }),
      client.from("reviews").select("*").order("id", { ascending: true }),
      client.from("transactions").select("*").order("id", { ascending: true }),
      client.from("withdrawals").select("*").order("id", { ascending: true })
    ]);
    if(pRes.error) throw pRes.error;

    const next = loadDB();
    if(sRes.data){
      next.commissionRate = Number(sRes.data.commission_rate ?? next.commissionRate);
      next.paymentSettings = {
        cashEnabled: sRes.data.cash_enabled !== false,
        transferEnabled: sRes.data.transfer_enabled !== false,
        bankName: sRes.data.bank_name || next.paymentSettings.bankName,
        accountNumber: sRes.data.account_number || next.paymentSettings.accountNumber,
        accountHolder: sRes.data.account_holder || next.paymentSettings.accountHolder
      };
    }
    if(Array.isArray(pRes.data)) next.pros = pRes.data.map(mapProFromRow);
    if(Array.isArray(jRes.data)) next.joinRequests = jRes.data.map(mapJoinFromRow);
    if(Array.isArray(oRes.data)) next.orders = oRes.data.map(mapOrderFromRow);
    if(Array.isArray(mRes.data)) next.messages = mRes.data.map(mapMsgFromRow);
    if(Array.isArray(rRes.data)) next.reviews = rRes.data.map(mapReviewFromRow);
    if(Array.isArray(tRes.data)) next.transactions = tRes.data.map(mapTxFromRow);
    if(Array.isArray(wRes.data)) next.withdrawals = wRes.data.map(mapWdFromRow);

    db = next;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){}
    render();
    if(showToastOnConnect) toast("تمت مزامنة البيانات من Supabase");
    return true;
  }catch(err){
    console.warn("Admin sync warning:", err?.message || err);
    return false;
  }
}

  if(!client || !id) return;
  try{
    await client.from(table).delete().eq("id", Number(id));
  }catch(err){
    console.warn("Admin delete error:", table, err?.message || err);
  }
}

async function pushStateToSupabase(){
  const client = initSupabaseClient();
  if(!client || sbSyncing || !isAdminVerified) return;
  sbSyncing = true;
  try{
    const ps = db.paymentSettings || {};
    await Promise.all([
      client.from("app_settings").upsert({
        id: 1,
        commission_rate: Number(db.commissionRate ?? 10),
        cash_enabled: ps.cashEnabled !== false,
        transfer_enabled: ps.transferEnabled !== false,
        bank_name: ps.bankName || "",
        account_number: ps.accountNumber || "",
        account_holder: ps.accountHolder || ""
      }, { onConflict: "id" }),
      db.pros.length ? client.from("pros").upsert(db.pros.map(mapProToRow), { onConflict: "id" }) : Promise.resolve(),
      db.joinRequests.length ? client.from("join_requests").upsert(db.joinRequests.map(mapJoinToRow), { onConflict: "id" }) : Promise.resolve(),
      db.orders.length ? client.from("orders").upsert(db.orders.map(mapOrderToRow), { onConflict: "id" }) : Promise.resolve(),
      db.messages.length ? client.from("messages").upsert(db.messages.map(mapMsgToRow), { onConflict: "id" }) : Promise.resolve(),
      db.reviews.length ? client.from("reviews").upsert(db.reviews.map(mapReviewToRow), { onConflict: "id" }) : Promise.resolve(),
      db.transactions.length ? client.from("transactions").upsert(db.transactions.map(mapTxToRow), { onConflict: "id" }) : Promise.resolve(),
      db.withdrawals.length ? client.from("withdrawals").upsert(db.withdrawals.map(mapWdToRow), { onConflict: "id" }) : Promise.resolve()
    ]);
  }catch(err){
    console.warn("Admin push error:", err?.message || err);
  }finally{
    sbSyncing = false;
  }
}

function subscribeSupabaseRealtime(){
  const client = initSupabaseClient();
  if(!client || client._akhdimliAdminRealtimeBound) return;
  client._akhdimliAdminRealtimeBound = true;
  const tables = ["app_settings","pros","join_requests","orders","messages","reviews","transactions","withdrawals"];
  const ch = client.channel("akhdimli-admin-live-db");
  tables.forEach(tbl => {
    ch.on("postgres_changes", { event: "*", schema: "public", table: tbl }, ()=>{
      if(sbSyncing || !isAdminVerified) return;
      clearTimeout(sbReloadTimer);
      sbReloadTimer = setTimeout(()=>syncFromSupabase(false), 180);
    });
  });
  ch.subscribe();
}

function saveDB(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){}
  pushStateToSupabase();
}

        <input type="email" id="admEmail" value="${currentAuthUser?.email || "Hobatb5@gmail.com"}" autocomplete="email">

        <input type="password" id="admPass" placeholder="••••••••" autocomplete="current-password">

        </div>
      </div>
    `;

      const em = document.getElementById("admEmail").value.trim();
      const pw = document.getElementById("admPass").value;
      if(!em || !pw){ authErrorMsg = "يرجى إدخال البريد وكلمة المرور."; render(); return; }
      loginAdmin(em, pw);
    };
    return;
  }

  const totalOrders = (db.orders || []).length;
  const completedOrders = (db.orders || []).filter(o => o.status === "مكتمل").length;
  const grossRevenue = (db.orders || []).filter(o => o.status === "مكتمل").reduce((s, o) => s + Number(o.amount || 0), 0);
  const platformFee = Math.round(grossRevenue * (Number(db.commissionRate || 0) / 100));
  const pendingJoins = (db.joinRequests || []).filter(j => j.status === "قيد المراجعة").length;
  const pendingWds = (db.withdrawals || []).filter(w => w.status === "قيد المراجعة").length;

  if(ui.tab === "overview"){
    const ps = db.paymentSettings;
    m.innerHTML = `
      <div class="card">
        <div class="top">
          <div class="av">أ</div>
          <div>
            <h3>${currentAuthProfile?.full_name || "مدير النظام"} <span class="badge ok">صلاحية: admin</span></h3>
            <div class="sub">${currentAuthUser?.email || ""}</div>
          </div>
          <button type="button" class="btn bad sm" id="admLogoutBtn" style="margin-inline-start:auto">خروج</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><small>إجمالي الحرفيين</small><b>${db.pros.length}</b></div>
        <div class="stat"><small>إجمالي الطلبات</small><b>${totalOrders}</b></div>
        <div class="stat"><small>الطلبات المكتملة</small><b>${completedOrders}</b></div>
        <div class="stat"><small>عمولة المنصة المقدّرة</small><b>${platformFee} د.ل</b></div>
      </div>

      <div class="card">
        <h3 style="margin:0 0 4px">إعدادات العمولة والدفع</h3>
        <div class="sub">تُزامَن مباشرة مع تطبيق المستخدم وتطبيق الحرفي.</div>
        <label>نسبة عمولة المنصة (%)</label>
        <input type="number" id="setComm" min="0" max="50" value="${db.commissionRate}">
        <label class="chk"><input type="checkbox" id="setCash" ${ps.cashEnabled !== false ? "checked" : ""}> تفعيل الدفع النقدي (كاش)</label>
        <label class="chk"><input type="checkbox" id="setTransfer" ${ps.transferEnabled !== false ? "checked" : ""}> تفعيل التحويل البنكي / المحفظة</label>
        <label>اسم الجهة / المصرف</label>
        <input id="setBankName" value="${ps.bankName || ""}">
        <label>رقم الحساب / المحفظة</label>
        <input id="setAccNum" value="${ps.accountNumber || ""}">
        <label>اسم المستفيد</label>
        <input id="setAccHolder" value="${ps.accountHolder || ""}">
        <div style="margin-top:14px">
          <button type="button" class="btn main" id="saveSettingsBtn" style="width:100%">حفظ إعدادات المنصة</button>
        </div>
      </div>
    `;

    document.getElementById("admLogoutBtn").onclick = logoutAdmin;
    document.getElementById("saveSettingsBtn").onclick = ()=>{
      const rate = Math.max(0, Math.min(50, Number(document.getElementById("setComm").value) || 0));
      db.commissionRate = rate;
      db.paymentSettings = {
        cashEnabled: document.getElementById("setCash").checked,
        transferEnabled: document.getElementById("setTransfer").checked,
        bankName: document.getElementById("setBankName").value.trim(),
        accountNumber: document.getElementById("setAccNum").value.trim(),
        accountHolder: document.getElementById("setAccHolder").value.trim()
      };
      saveDB();
      toast("تم حفظ إعدادات المنصة");
      render();
    };
  }

  if(ui.tab === "pros"){
    m.innerHTML = `
      <div class="card">
        <div class="row">
          <button type="button" class="btn main" id="openAddPro">+ إضافة حرفي جديد</button>
          <button type="button" class="btn" id="forceSyncBtn">مزامنة الآن</button>
        </div>
      </div>
    `;
    document.getElementById("openAddPro").onclick = openAddProModal;

    if(!db.pros.length){
      m.insertAdjacentHTML("beforeend",`<div class="empty"><b>لا يوجد حرفيون مسجلون حالياً</b></div>`);
    } else {
      db.pros.forEach(p=>{
        const card = document.createElement("div");

        card.innerHTML = `
          <div class="top">
            <div class="av">${(p.name||"ح")[0]}</div>

              <h3>

                ${p.verified ? `<span class="badge ok">موثّق</span>` : `<span class="badge">غير موثّق</span>`}
              </h3>
              <div class="sub">${p.spec} • ${p.city} • ${p.phone} • الرصيد: <b>${p.balance || 0} د.ل</b></div>
            </div>

          <p class="desc">${p.desc || "بدون وصف"}</p>

            <button type="button" class="btn sm ${p.verified ? "" : "main"}" data-ver="${p.id}">${p.verified ? "إلغاء التوثيق" : "توثيق"}</button>
