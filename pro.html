<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6B76">
<title>اخدملي — تطبيق الحرفي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4F4;--card:#fff;--ink:#12292D;--mut:#5B7276;
  --pri:#0B6B76;--pri2:#095560;--on:#fff;--acc:#F59E0B;
  --line:#D5E2E3;--ok:#157347;--bad:#B3261E;--adm:#1E293B;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1C1F;--card:#15292D;--ink:#E7F1F2;--mut:#93ABAF;
    --pri:#2BB3C0;--pri2:#5CCAD5;--on:#06262A;--line:#254247;
    --ok:#5BD48A;--bad:#FF8A80;--adm:#334155;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1C1F;--card:#15292D;--ink:#E7F1F2;--mut:#93ABAF;
  --pri:#2BB3C0;--pri2:#5CCAD5;--on:#06262A;--line:#254247;
  --ok:#5BD48A;--bad:#FF8A80;--adm:#334155;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Cairo,Tahoma,Arial,sans-serif;font-size:15.5px;line-height:1.6;
  padding-bottom:88px;
}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--card);
  border-bottom:1px solid var(--line);padding:12px 16px;
}
.topbar-in{
  max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(180deg,#169AA6,#0A5C68);
  display:grid;place-items:center;flex:none;
}
.brand b{display:block;font-size:19px;font-weight:800;line-height:1.15}
.brand small{color:var(--mut);font-size:12.5px}
.icon-btn{
  margin-inline-start:auto;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;flex:none;padding:0;
}
main{max-width:680px;margin:0 auto;padding:14px 16px 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat small{color:var(--mut);font-size:12.5px;display:block}
.stat b{font-size:22px;font-weight:800;line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.top{display:flex;gap:12px;align-items:center}
.av{
  width:48px;height:48px;border-radius:50%;
  background:color-mix(in srgb,var(--pri) 15%,var(--card));
  color:var(--pri2);display:grid;place-items:center;flex:none;
}
.top h3{margin:0;font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sub{color:var(--mut);font-size:13px}
.desc{margin:10px 0 12px;font-size:14.5px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  flex:1;min-width:95px;text-align:center;text-decoration:none;font:inherit;
  font-weight:700;font-size:13.5px;border-radius:11px;padding:9px 12px;
  border:1.5px solid var(--pri);color:var(--pri2);background:transparent;cursor:pointer;
}
.btn.main{background:var(--pri);color:var(--on)}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{flex:0 0 auto;min-width:auto;padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{
  font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;
  background:color-mix(in srgb,var(--acc) 22%,var(--card));white-space:nowrap;
}
.badge.ok{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ok)}
.badge.bad{background:color-mix(in srgb,var(--bad) 18%,var(--card));color:var(--bad)}
input,textarea,select{
  width:100%;font:inherit;color:var(--ink);background:var(--card);
  border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;
}
label{display:block;font-weight:700;font-size:13.5px;margin:10px 0 4px}
.hero{
  background:linear-gradient(135deg,#0B6B76,#09444D);color:#fff;
  border-radius:18px;padding:18px;margin-bottom:12px;
}
.hero b{display:block;font-size:30px;font-weight:800;line-height:1.25}
.empty{text-align:center;color:var(--mut);padding:36px 16px}
.empty b{display:block;color:var(--ink);font-size:16.5px;margin-bottom:4px}
.tx-row{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;
}
.tx-row:last-child{border-bottom:0}
.chat-box{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  display:flex;flex-direction:column;height:calc(100vh - 185px);min-height:360px;overflow:hidden;
}
.chat-head{
  padding:10px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;background:var(--card);
}
.chat-msgs{
  flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;
  background:color-mix(in srgb,var(--bg) 55%,transparent);
}
.msg{
  max-width:80%;padding:9px 13px;border-radius:14px;font-size:14.5px;line-height:1.5;
  word-wrap:break-word;
}
.msg.me{
  align-self:flex-start;background:var(--pri);color:var(--on);
  border-bottom-right-radius:4px;
}
.msg.them{
  align-self:flex-end;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-bottom-left-radius:4px;
}
.msg-meta{font-size:11px;opacity:.75;margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.chat-form{
  padding:10px;border-top:1px solid var(--line);background:var(--card);
  display:flex;gap:8px;align-items:center;
}
.chat-form input{flex:1;padding:9px 12px}
.auth-tabs{display:flex;gap:8px;margin-bottom:12px}
.auth-tabs button{flex:1}
.auth-err{color:var(--bad);font-size:13px;font-weight:700;margin-top:8px;min-height:20px}
nav{
  position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20;
}
nav button{
  flex:1;border:0;background:none;font:inherit;font-size:12px;
  color:var(--mut);padding:8px 4px 6px;cursor:pointer;position:relative;
}
nav button svg{display:block;margin:0 auto 3px}
nav button[aria-current="page"]{color:var(--pri2);font-weight:800}
.nav-cnt{
  position:absolute;top:4px;inset-inline-end:calc(50% - 22px);
  min-width:17px;height:17px;padding:0 4px;border-radius:999px;
  background:var(--acc);color:#12292D;font-size:10.5px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;line-height:1;
}
dialog{
  width:min(92vw,460px);border:0;border-radius:18px;padding:18px;
  background:var(--card);color:var(--ink);
}
dialog::backdrop{background:rgba(0,0,0,.5)}
#toast{
  position:fixed;inset-inline:16px;bottom:84px;margin:auto;max-width:360px;
  background:var(--ink);color:var(--bg);text-align:center;border-radius:12px;
  padding:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:50;
}
#toast.on{opacity:1}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo">
        <svg width="34" height="34" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 23L24 8l17 15v17H7z" stroke="#fff" stroke-width="3"/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const SPECS = ["سباكة","كهرباء","نجارة","دهان","تكييف","بناء","حدادة","ألمنيوم","تنظيف"];

  moon:'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'

const ICK = {
  "سباكة":"wrench","كهرباء":"bolt","نجارة":"hammer","دهان":"roller",
  "تكييف":"snow","بناء":"brick","حدادة":"flame","ألمنيوم":"window","تنظيف":"sparkle"
};

function svgIcon(name, size=22){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[name]||P.wrench}</svg>`;
}
const specIcon = (spec, size=24) => svgIcon(ICK[spec] || "wrench", size);

const DEFAULT_DATA = {
  commissionRate: 10,
  paymentSettings: {
    cashEnabled: true,
    transferEnabled: true,
    bankName: "مصرف معتمد / محفظة إلكترونية",
    accountNumber: "",
    accountHolder: "منصة اخدملي"
  },
  pros: [
    {id:1,name:"المعلم سالم",spec:"سباكة",city:"البيضاء",phone:"218910000001",price:"من 40 د.ل",desc:"تمديدات وصيانة وكشف التسربات.",rating:4.8,jobs:32,verified:true,active:true,available:true,balance:240},
    {id:2,name:"المعلم فرج",spec:"كهرباء",city:"البيضاء",phone:"218910000002",price:"من 50 د.ل",desc:"تأسيس وصيانة كهرباء المنازل والمحلات.",rating:4.6,jobs:21,verified:true,active:true,available:true,balance:185},
    {id:3,name:"المعلم إدريس",spec:"نجارة",city:"شحات",phone:"218910000003",price:"حسب العمل",desc:"مطابخ وأبواب وغرف نوم حسب الطلب.",rating:4.9,jobs:18,verified:true,active:true,available:false,balance:310},
    {id:4,name:"المعلم مفتاح",spec:"دهان",city:"البيضاء",phone:"218910000004",price:"من 15 د.ل للمتر",desc:"دهان داخلي وخارجي وتجديد الجدران.",rating:4.5,jobs:27,verified:false,active:true,available:true,balance:90}
  ],
  joinRequests: [],
  orders: [],
  messages: [],
  reviews: [],
  transactions: [],
  withdrawals: [],
  userProfile: {name:"",phone:"",city:"البيضاء",address:"",bio:""}
};

function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : structuredClone(DEFAULT_DATA);
    if(!parsed.messages) parsed.messages = [];
    if(!parsed.paymentSettings) parsed.paymentSettings = structuredClone(DEFAULT_DATA.paymentSettings);
    if(!parsed.userProfile) parsed.userProfile = structuredClone(DEFAULT_DATA.userProfile);
    if(!parsed.reviews) parsed.reviews = [];
    if(!parsed.transactions) parsed.transactions = [];
    if(!parsed.withdrawals) parsed.withdrawals = [];
    parsed.pros = (parsed.pros || []).map(p => ({ available: true, ...p }));
    parsed.orders = (parsed.orders || []).map(o => ({ ratingGiven: 0, reviewText: "", ...o }));
    return parsed;
  }catch(e){
    return structuredClone(DEFAULT_DATA);
  }
}

let db = loadDB();

const SUPABASE_URL = "https://mfuwlvybsdgsesbdbivb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mdXdsdnlic2Rnc2VzYmRiaXZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1OTk1MTgsImV4cCI6MjExMTE3NTUxOH0.hq19DT-bWXkYuzRK3TLzQGuywrJUy8oonKjv_Ykk5qg";

let sbClient = null;
let sbConnected = false;
let sbSyncing = false;
let sbReloadTimer = null;

let currentAuthUser = null;
let currentAuthProfile = null;
let authBannerMessage = "";

let hasInitialSyncCompleted = false;
let seenMsgIds = new Set((db.messages || []).map(x => Number(x.id)));
let seenOrderIds = new Set((db.orders || []).map(o => Number(o.id)));
let unreadIncomingMsgs = 0;
let unreadNewOrders = 0;

const ui = { tab: "work", activeProId: 1, activeConvKey: "" };

function normalizePhone(n){
  return (n || "").replace(/\D/g, "");
}

function getActivePro(){
  return db.pros.find(p => Number(p.id) === Number(ui.activeProId)) || db.pros[0] || {
    id:1,name:"حرفي",spec:"سباكة",city:"البيضاء",phone:"",price:"حسب العمل",
    desc:"",rating:5.0,jobs:0,verified:false,active:true,available:true,balance:0
  };
}

function nowTime(){
  const d = new Date();
  return d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
}

let themeMode = "auto";
let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("on"), 2800);
}
function updateThemeIcon(){
  const isDark = themeMode === "dark" || (themeMode === "auto" && window.matchMedia("(prefers-color-scheme:dark)").matches);
  document.getElementById("themeBtn").innerHTML = svgIcon(isDark ? "sun" : "moon", 18);
}
function toggleTheme(){
  const isDark = themeMode === "dark" || (themeMode === "auto" && window.matchMedia("(prefers-color-scheme:dark)").matches);
  themeMode = isDark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", themeMode);
  updateThemeIcon();
}

function confirmAction({title="تأكيد الإجراء", message="هل أنت متأكد من تنفيذ هذا الإجراء؟", confirmText="تأكيد", danger=false}){
  return new Promise(resolve=>{
    const dlg = document.getElementById("dlg");
    dlg.innerHTML = `
      <h2 style="margin:0 0 6px">${title}</h2>
      <div class="desc" style="margin:6px 0 14px">${message}</div>
      <div class="row">
        <button type="button" class="btn" id="cfCancel">تراجع</button>
        <button type="button" class="btn ${danger?"bad":"main"}" id="cfOk">${confirmText}</button>
      </div>
    `;
    dlg.showModal();
    let done = false;
    const finish = (val)=>{
      if(done) return;
      done = true;
      dlg.close();
      resolve(val);
    };
    document.getElementById("cfCancel").onclick = ()=>finish(false);
    document.getElementById("cfOk").onclick = ()=>finish(true);
    dlg.oncancel = ()=>finish(false);
  });
}

function initSupabaseClient(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase?.createClient) return null;
  if(!sbClient){
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
  }
  return sbClient;
}

async function matchProFromProfile(prof){
  if(!prof || !Array.isArray(db.pros) || !db.pros.length) return null;
  const pPhone = normalizePhone(prof.phone);
  if(pPhone){
    const byPhone = db.pros.find(p => normalizePhone(p.phone) === pPhone);
    if(byPhone) return byPhone;
  }
  const pName = (prof.full_name || "").trim();
  if(pName){
    const byName = db.pros.find(p => (p.name || "").trim() === pName);
    if(byName) return byName;
  }
  return null;
}

async function ensureProProfileAndStatus(user){
  const client = initSupabaseClient();
  if(!client || !user) return null;
  try{
    let { data: prof, error } = await client
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();
    if(error) throw error;

    if(!prof){
      const meta = user.user_metadata || {};
      const { data: inserted } = await client
        .from("profiles")
        .upsert({
          id: user.id,
          full_name: meta.full_name || user.email?.split("@")[0] || "حرفي",
          phone: meta.phone || "",
          city: meta.city || "البيضاء",
          role: "pro",
          is_active: true
        }, { onConflict: "id" })
        .select("*")
        .maybeSingle();
      if(inserted) prof = inserted;
    }

    if(prof && prof.is_active === false){
      authBannerMessage = "تم إيقاف هذا الحساب من قِبل الإدارة. يرجى التواصل مع الدعم.";
      await client.auth.signOut();
      currentAuthUser = null;
      currentAuthProfile = null;
      render();
      return null;
    }

    currentAuthUser = user;
    currentAuthProfile = prof || { id: user.id, full_name: user.user_metadata?.full_name || "", is_active: true, role: "pro" };
    authBannerMessage = "";

    const matchedPro = await matchProFromProfile(currentAuthProfile);
    if(matchedPro){
      ui.activeProId = matchedPro.id;
    }
    return currentAuthProfile;
  }catch(e){
    console.warn("Pro profile check warning:", e?.message || e);
    currentAuthUser = user;
    return currentAuthProfile;
  }
}

function initAuthListener(){
  const client = initSupabaseClient();
  if(!client || client._akhdimliProAuthBound) return;
  client._akhdimliProAuthBound = true;

  client.auth.getSession().then(async ({ data })=>{
    if(data?.session?.user){
      await ensureProProfileAndStatus(data.session.user);
      render();
    }
  });

  client.auth.onAuthStateChange(async (event, session)=>{
    if(session?.user){
      await ensureProProfileAndStatus(session.user);
      render();
    } else if(event === "SIGNED_OUT"){
      currentAuthUser = null;
      currentAuthProfile = null;
      render();
    }
  });
}

function openAuthModal(initialMode = "login"){
  const client = initSupabaseClient();
  if(!client){ toast("تعذر الاتصال بخدمة المصادقة"); return; }
  let mode = initialMode;
  const dlg = document.getElementById("dlg");

  const paint = ()=>{
    dlg.innerHTML = `
      <h2 style="margin:0 0 4px">${mode === "login" ? "تسجيل دخول الحرفي" : "إنشاء حساب حرفي"}</h2>

        <button type="button" class="btn sm ${mode==="login"?"main":""}" id="mTabLogin">تسجيل دخول</button>
        <button type="button" class="btn sm ${mode==="signup"?"main":""}" id="mTabSignup">حساب جديد</button>
      </div>
      ${mode === "signup" ? `
        <label>الاسم الكامل</label>
        <input id="authName" placeholder="مثال: المعلم سالم">
        <label>رقم الهاتف</label>
        <input id="authPhone" placeholder="091...">
        <label>المدينة</label>
        <input id="authCity" value="البيضاء">
      ` : ""}
      <label>البريد الإلكتروني</label>
      <input type="email" id="authEmail" placeholder="pro@example.com" autocomplete="email">
      <label>كلمة المرور</label>
      <input type="password" id="authPass" placeholder="••••••••" autocomplete="${mode==="login"?"current-password":"new-password"}">
      <div class="auth-err" id="authModalErr">${authBannerMessage || ""}</div>
      <div class="row" style="margin-top:14px">
        <button type="button" class="btn" id="authCancel">إغلاق</button>
        <button type="button" class="btn main" id="authSubmit">${mode === "login" ? "دخول" : "إنشاء الحساب"}</button>
      </div>
    `;
    document.getElementById("mTabLogin").onclick = ()=>{ mode = "login"; paint(); };
    document.getElementById("mTabSignup").onclick = ()=>{ mode = "signup"; paint(); };
    document.getElementById("authCancel").onclick = ()=>dlg.close();

    document.getElementById("authSubmit").onclick = async ()=>{
      const errEl = document.getElementById("authModalErr");
      const btn = document.getElementById("authSubmit");
      const email = (document.getElementById("authEmail")?.value || "").trim();
      const password = document.getElementById("authPass")?.value || "";
      if(!email || !password){
        errEl.textContent = "يرجى إدخال البريد الإلكتروني وكلمة المرور.";
        return;
      }
      btn.disabled = true;
      errEl.textContent = "";
      try{
        if(mode === "login"){
          const { data, error } = await client.auth.signInWithPassword({ email, password });
          if(error) throw error;
          const prof = await ensureProProfileAndStatus(data.user);
          if(!prof){
            errEl.textContent = authBannerMessage || "الحساب موقوف مؤقتاً.";
            btn.disabled = false;
            return;
          }
          dlg.close();
          toast("تم تسجيل الدخول بنجاح");
          render();
        } else {
          const fullName = (document.getElementById("authName")?.value || "").trim();
          const phone = (document.getElementById("authPhone")?.value || "").trim();
          const city = (document.getElementById("authCity")?.value || "البيضاء").trim();
          const { data, error } = await client.auth.signUp({
            email,
            password,
            options: { data: { full_name: fullName, role: "pro" } }
          });
          if(error) throw error;
          if(data.user && data.session){
            await client.from("profiles").upsert({
              id: data.user.id,
              full_name: fullName || "حرفي",
              phone,
              city,
              role: "pro",
              is_active: true
            }, { onConflict: "id" });
            await ensureProProfileAndStatus(data.user);
            dlg.close();
            toast("تم إنشاء حساب الحرفي وتسجيل الدخول");
            render();
          } else {
            errEl.style.color = "var(--ok)";
            errEl.textContent = "تم إنشاء الحساب! تحقق من بريدك الإلكتروني لتأكيد الحساب ثم سجّل الدخول.";
            btn.disabled = false;
          }
        }
      }catch(e){
        errEl.style.color = "var(--bad)";
        errEl.textContent = e?.message || "تعذر إتمام العملية، تحقق من البيانات.";
        btn.disabled = false;
      }
    };
  };

  paint();
  dlg.showModal();
}

function notifyProIncomingUpdates(activeProId){
  if(!hasInitialSyncCompleted){
    seenMsgIds = new Set((db.messages || []).map(x => Number(x.id)));
    seenOrderIds = new Set((db.orders || []).map(o => Number(o.id)));
    hasInitialSyncCompleted = true;
    return;
  }

  let newUserMsgs = 0;
  let lastSenderName = "";
  (db.messages || []).forEach(msg => {
    const mid = Number(msg.id);
    if(!seenMsgIds.has(mid)){
      seenMsgIds.add(mid);
      if(msg.sender === "user" && Number(msg.proId) === Number(activeProId)){
        newUserMsgs++;
        lastSenderName = msg.customerName || "عميل";
      }
    }
  });

  if(newUserMsgs > 0){
    if(ui.tab !== "chat") unreadIncomingMsgs += newUserMsgs;
    toast(newUserMsgs === 1
      ? `رسالة جديدة من ${lastSenderName}`
      : `وصلك ${newUserMsgs} رسائل جديدة من العملاء`);
  }

  let newOrdersCount = 0;
  (db.orders || []).forEach(o => {
    const oid = Number(o.id);
    if(!seenOrderIds.has(oid)){
      seenOrderIds.add(oid);
      if(Number(o.proId) === Number(activeProId)){
        newOrdersCount++;
      }
    }
  });

  if(newOrdersCount > 0){
    if(ui.tab !== "work") unreadNewOrders += newOrdersCount;
    toast(newOrdersCount === 1
      ? "وصل طلب خدمة جديد إلى حسابك"
      : `وصلك ${newOrdersCount} طلبات خدمة جديدة`);
  }
}

async function syncFromSupabase(showToastOnConnect=false){
  const client = initSupabaseClient();
  if(!client) return false;
  try{
    const [sRes, pRes, jRes, oRes, mRes, rRes, tRes, wRes] = await Promise.all([
      client.from("app_settings").select("*").eq("id", 1).maybeSingle(),
      client.from("pros").select("*").order("id", { ascending: true }),
      client.from("join_requests").select("*").order("id", { ascending: true }),
      client.from("orders").select("*").order("id", { ascending: true }),
      client.from("messages").select("*").order("id", { ascending: true }),
      client.from("reviews").select("*").order("id", { ascending: true }),
      client.from("transactions").select("*").order("id", { ascending: true }),
      client.from("withdrawals").select("*").order("id", { ascending: true })
    ]);
    if(pRes.error) throw pRes.error;

    const next = loadDB();
    if(sRes.data){
      next.commissionRate = Number(sRes.data.commission_rate ?? next.commissionRate);
      next.paymentSettings = {
        cashEnabled: sRes.data.cash_enabled !== false,
        transferEnabled: sRes.data.transfer_enabled !== false,
        bankName: sRes.data.bank_name || next.paymentSettings.bankName,
        accountNumber: sRes.data.account_number || next.paymentSettings.accountNumber,
        accountHolder: sRes.data.account_holder || next.paymentSettings.accountHolder
      };
    }
    if(Array.isArray(pRes.data) && pRes.data.length) next.pros = pRes.data.map(mapProFromRow);
    if(Array.isArray(jRes.data)) next.joinRequests = jRes.data.map(mapJoinFromRow);
    if(Array.isArray(oRes.data)) next.orders = oRes.data.map(mapOrderFromRow);
    if(Array.isArray(mRes.data)) next.messages = mRes.data.map(mapMsgFromRow);
    if(Array.isArray(rRes.data)) next.reviews = rRes.data.map(mapReviewFromRow);
    if(Array.isArray(tRes.data)) next.transactions = tRes.data.map(mapTxFromRow);
    if(Array.isArray(wRes.data)) next.withdrawals = wRes.data.map(mapWdFromRow);

    db = next;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){}
    if(currentAuthProfile){
      const matched = await matchProFromProfile(currentAuthProfile);
      if(matched) ui.activeProId = matched.id;
    }
    notifyProIncomingUpdates(getActivePro().id);
    const firstConnect = !sbConnected;
    sbConnected = true;
    render();
    if(showToastOnConnect && firstConnect) toast("متصل بقاعدة بيانات Supabase");
    return true;
  }catch(err){
    console.warn("Pro sync fallback:", err?.message || err);
    return false;
  }
}

async function pushStateToSupabase(){
  const client = initSupabaseClient();
  if(!client || sbSyncing) return;
  sbSyncing = true;
  try{
    const ps = db.paymentSettings || {};
    await Promise.all([
      client.from("app_settings").upsert({
        id: 1,
        commission_rate: Number(db.commissionRate ?? 10),
        cash_enabled: ps.cashEnabled !== false,
        transfer_enabled: ps.transferEnabled !== false,
        bank_name: ps.bankName || "",
        account_number: ps.accountNumber || "",
        account_holder: ps.accountHolder || ""
      }, { onConflict: "id" }),
      db.pros.length ? client.from("pros").upsert(db.pros.map(mapProToRow), { onConflict: "id" }) : Promise.resolve(),
      db.joinRequests.length ? client.from("join_requests").upsert(db.joinRequests.map(mapJoinToRow), { onConflict: "id" }) : Promise.resolve(),
      db.orders.length ? client.from("orders").upsert(db.orders.map(mapOrderToRow), { onConflict: "id" }) : Promise.resolve(),
      db.messages.length ? client.from("messages").upsert(db.messages.map(mapMsgToRow), { onConflict: "id" }) : Promise.resolve(),
      db.reviews.length ? client.from("reviews").upsert(db.reviews.map(mapReviewToRow), { onConflict: "id" }) : Promise.resolve(),
      db.transactions.length ? client.from("transactions").upsert(db.transactions.map(mapTxToRow), { onConflict: "id" }) : Promise.resolve(),
      db.withdrawals.length ? client.from("withdrawals").upsert(db.withdrawals.map(mapWdToRow), { onConflict: "id" }) : Promise.resolve()
    ]);
  }catch(err){
    console.warn("Pro push error:", err?.message || err);
  }finally{
    sbSyncing = false;
  }
}

async function submitWithdrawalDirect(pro, amt, phone){
  const wdItem = {
    id: Date.now(),
    proId: Number(pro.id),
    proName: pro.name,
    phone: phone || pro.phone || "",
    amount: Number(amt),
    status: "قيد المراجعة",
    time: nowTime()
  };
  const txItem = {
    id: Date.now() + 1,
    proId: Number(pro.id),
    title: "طلب سحب رصيد (" + Number(amt) + " د.ل)",
    amount: Number(amt),
    type: "debit",
    time: nowTime()
  };

  const prevBalance = Number(pro.balance || 0);
  pro.balance = Math.max(0, prevBalance - Number(amt));
  db.withdrawals.push(wdItem);
  db.transactions.push(txItem);
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){}

  const client = initSupabaseClient();
  if(client){
    const [wRes, tRes, pRes] = await Promise.all([
      client.from("withdrawals").upsert(mapWdToRow(wdItem), { onConflict: "id" }),
      client.from("transactions").upsert(mapTxToRow(txItem), { onConflict: "id" }),
      client.from("pros").upsert(mapProToRow(pro), { onConflict: "id" })
    ]);
    const dbErr = wRes.error || tRes.error || pRes.error;
    if(dbErr){
      pro.balance = prevBalance;
      db.withdrawals = db.withdrawals.filter(x => x.id !== wdItem.id);
      db.transactions = db.transactions.filter(x => x.id !== txItem.id);
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){}
      return { ok: false, error: dbErr.message || "تعذر حفظ طلب السحب في قاعدة البيانات" };
    }
  }
  return { ok: true };
}

function subscribeSupabaseRealtime(){
  const client = initSupabaseClient();
  if(!client || client._akhdimliProRealtimeBound) return;
  client._akhdimliProRealtimeBound = true;
  const tables = ["app_settings","pros","join_requests","orders","messages","reviews","transactions","withdrawals"];
  const ch = client.channel("akhdimli-pro-live-db");
  tables.forEach(tbl => {
    ch.on("postgres_changes", { event: "*", schema: "public", table: tbl }, ()=>{
      if(sbSyncing) return;
      clearTimeout(sbReloadTimer);
      sbReloadTimer = setTimeout(()=>syncFromSupabase(false), 180);
    });
  });
  ch.subscribe();
}

function saveDB(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){}
  pushStateToSupabase();
}

function completeOrderAndCredit(order, pro){
  if(order.status === "مكتمل") return;
  order.status = "مكتمل";
  order.paid = true;
  pro.jobs = (pro.jobs || 0) + 1;
  const net = Math.round((Number(order.amount) || 0) * (1 - db.commissionRate/100));
  pro.balance = (pro.balance || 0) + net;
  db.transactions.push({
    id: Date.now() + Math.floor(Math.random()*90),
    proId: pro.id,
    title: "إتمام طلب #" + order.id + " (" + order.customerName + ")",
    amount: net,
    type: "credit",
    time: nowTime()
  });
}

function sendMsg({proId, customerPhone, customerName, sender, text}){
  const clean = (text||"").trim();
  if(!clean) return false;
  const newId = Date.now() + Math.floor(Math.random()*100);
  seenMsgIds.add(newId);
  db.messages.push({
    id: newId,
    proId,
    userId: currentAuthUser?.id || "",
    customerPhone: customerPhone || "",
    customerName: customerName || "عميل",
    sender,
    text: clean,
    time: nowTime()
  });
  saveDB();
  return true;
}

function getConvsForPro(proId){
  const map = new Map();
  (db.messages || []).filter(m => Number(m.proId) === Number(proId)).forEach(m => {
    const ph = normalizePhone(m.customerPhone);
    const key = m.userId ? "uid:" + m.userId : (ph ? "ph:" + ph : "name:" + (m.customerName || "عميل"));
    if(!map.has(key)){
      map.set(key, {
        key,
        customerName: m.customerName || "عميل",
        customerPhone: m.customerPhone || "",
        userId: m.userId || "",
        lastText: m.text,
        lastTime: m.time
      });
    } else {
      const cur = map.get(key);
      cur.lastText = m.text;
      cur.lastTime = m.time;
      if(m.customerName) cur.customerName = m.customerName;
    }
  });
  return [...map.values()];
}

            ` : ""}
            ${!isProSuspended && o.status === "قيد التنفيذ" ? `
              <button class="btn main sm" data-finish="${o.id}">إتمام وتسوية</button>
            ` : ""}
            <button class="btn sm" data-msgcust="${o.id}">مراسلة العميل</button>
          </div>
        `;
        if(card.querySelector("[data-accept]")){
          card.querySelector("[data-accept]").onclick = ()=>{
            o.status = "قيد التنفيذ";
            saveDB(); toast("تم قبول الطلب"); render();
          };
        }
        if(card.querySelector("[data-reject]")){
          card.querySelector("[data-reject]").onclick = async ()=>{
            const ok = await confirmAction({
              title: "رفض الطلب",
              message: `هل أنت متأكد من رفض طلب <b>${o.customerName}</b>؟`,
              confirmText: "رفض الطلب",
              danger: true
            });
            if(!ok) return;
            o.status = "ملغي";
            saveDB(); toast("تم رفض الطلب"); render();
          };
        }
        if(card.querySelector("[data-finish]")){
          card.querySelector("[data-finish]").onclick = async ()=>{
            const ok = await confirmAction({
              title: "إتمام الطلب وتسوية الرصيد",
              message: `تأكيد إتمام الطلب #${o.id} بقيمة <b>${o.amount} د.ل</b>؟`,
              confirmText: "إتمام الطلب"
            });
            if(!ok) return;
            completeOrderAndCredit(o, pro);
            saveDB(); toast("تم إتمام الطلب وإضافة صافي الرصيد"); render();
          };
        }
        card.querySelector("[data-msgcust]").onclick = ()=>{
          const ph = normalizePhone(o.customerPhone);
          ui.activeConvKey = o.userId ? "uid:" + o.userId : (ph ? "ph:" + ph : "name:" + o.customerName);
          ui.tab = "chat";
          render();
        };
        m.append(card);
      });
    }
  }

  if(ui.tab === "chat"){
    const convs = getConvsForPro(pro.id);
    const activeConv = convs.find(c => c.key === ui.activeConvKey) || convs[0];
    if(!activeConv){
      m.innerHTML = `<div class="empty"><b>لا توجد محادثات مع العملاء بعد</b>عندما يراسلك عميل ستظهر محادثته هنا.</div>`;
    } else {
      ui.activeConvKey = activeConv.key;
      const convMsgs = (db.messages || []).filter(msg => {
        if(Number(msg.proId) !== Number(pro.id)) return false;
        const mPh = normalizePhone(msg.customerPhone);
        const mKey = msg.userId ? "uid:" + msg.userId : (mPh ? "ph:" + mPh : "name:" + (msg.customerName || "عميل"));
        return mKey === activeConv.key;
      });

      m.innerHTML = `
        <div class="chat-box">
          <div class="chat-head">
            <div class="av" style="width:38px;height:38px">${svgIcon("user", 20)}</div>
            <div style="flex:1;min-width:0">
              <b>${activeConv.customerName}</b>
              <div class="sub">${activeConv.customerPhone || "عميل المنصة"}</div>
            </div>
            <select id="convSelect" style="width:auto;padding:5px 8px;font-size:12.5px" aria-label="اختر محادثة">
              ${convs.map(c=>`<option value="${c.key}" ${c.key===activeConv.key?"selected":""}>${c.customerName}</option>`).join("")}
            </select>
          </div>
          <div class="chat-msgs" id="chatMsgs">
            ${convMsgs.map(msg => `
              <div class="msg ${msg.sender === "pro" ? "me" : "them"}">
                <div>${msg.text}</div>
                <div class="msg-meta">
                  <span>${msg.sender === "pro" ? pro.name : activeConv.customerName}</span>
                  <span>${msg.time}</span>
                </div>
              </div>
            `).join("")}
          </div>
          <form class="chat-form" id="chatForm">
            <input id="chatInput" placeholder="${isProSuspended ? "الحساب موقوف حالياً..." : "اكتب ردك للعميل..."}" autocomplete="off" ${isProSuspended ? "disabled" : ""}>
            <button class="btn main sm" type="submit" aria-label="إرسال" ${isProSuspended ? "disabled" : ""}>${svgIcon("send", 18)}</button>
          </form>
        </div>
      `;

      const box = document.getElementById("chatMsgs");
      box.scrollTop = box.scrollHeight;

      document.getElementById("convSelect").onchange = e => {
        ui.activeConvKey = e.target.value;
        render();
      };
      document.getElementById("chatForm").onsubmit = e => {
        e.preventDefault();
        if(isProSuspended){ toast("الحساب موقوف حالياً"); return; }
        const inp = document.getElementById("chatInput");
        if(sendMsg({
          proId: pro.id,
          customerPhone: activeConv.customerPhone,
          customerName: activeConv.customerName,
          sender: "pro",
          text: inp.value
        })){
          inp.value = "";
          render();
        }
      };
    }
  }

  if(ui.tab === "wallet"){
    m.innerHTML = `
      <div class="card">
        <div class="sub">المحفظة • ${pro.name}</div>
        <div style="font-size:28px;font-weight:800;color:var(--pri2)">${pro.balance || 0} د.ل</div>
        <div class="sub">نسبة العمولة المطبقة: <b>${db.commissionRate}%</b></div>
        <div class="row" style="margin-top:12px">
          <button class="btn main" id="reqWithdrawBtn" ${isProSuspended || (pro.balance||0) <= 0 ? "disabled" : ""}>طلب سحب رصيد</button>
          <button class="btn sm" id="syncWalletBtn">مزامنة الآن</button>
        </div>
      </div>

      <div class="card">
        <h3 style="margin:0 0 8px">طلبات السحب (${myWds.length})</h3>
        ${myWds.length ? [...myWds].reverse().map(w => `
          <div class="tx-row">
            <div>
              <b>${w.amount} د.ل</b>
              <div class="sub">${w.time} • ${w.phone || ""}</div>
            </div>
            <span class="badge ${w.status==="مقبول"||w.status==="مكتمل"?"ok":w.status==="مرفوض"?"bad":""}">${w.status}</span>
          </div>
        `).join("") : `<div class="sub">لا توجد طلبات سحب مسجلة.</div>`}
      </div>

      <div class="card">
        <h3 style="margin:0 0 8px">سجل المعاملات (${myTxs.length})</h3>
        ${myTxs.length ? [...myTxs].reverse().map(t => `
          <div class="tx-row">
            <div>
              <b>${t.title}</b>
              <div class="sub">${t.time}</div>
            </div>
            <b style="color:${t.type==="debit"?"var(--bad)":"var(--ok)"}">${t.type==="debit"?"-":"+"}${t.amount} د.ل</b>
          </div>
        `).join("") : `<div class="sub">لا توجد معاملات مالية بعد.</div>`}
      </div>
    `;

    document.getElementById("syncWalletBtn").onclick = ()=>syncFromSupabase(true);

    const wdBtn = document.getElementById("reqWithdrawBtn");
    if(wdBtn){
      wdBtn.onclick = ()=>{
        const dlg = document.getElementById("dlg");
        dlg.innerHTML = `
          <h2 style="margin:0 0 6px">طلب سحب رصيد</h2>
          <div class="sub">الرصيد المتاح: <b>${pro.balance || 0} د.ل</b></div>
          <label>المبلغ المطلوب سحبه (د.ل)</label>
          <input type="number" id="wdAmt" max="${pro.balance || 0}" min="1" value="${Math.min(50, pro.balance || 0)}">
          <label>رقم الهاتف / المحفظة للاستلام</label>
          <input id="wdPhone" value="${pro.phone || ""}">
          <div class="auth-err" id="wdErr"></div>
          <div class="row" style="margin-top:14px">
            <button type="button" class="btn" id="wdCancel">إلغاء</button>
            <button type="button" class="btn main" id="wdSend">إرسال الطلب</button>
          </div>
        `;
        dlg.showModal();
        document.getElementById("wdCancel").onclick = ()=>dlg.close();
        document.getElementById("wdSend").onclick = async ()=>{
          const sendBtn = document.getElementById("wdSend");
          const errEl = document.getElementById("wdErr");
          const amt = Number(document.getElementById("wdAmt").value);
          const ph = document.getElementById("wdPhone").value.trim();
          if(!amt || amt <= 0 || amt > (pro.balance || 0)){
            errEl.textContent = "يرجى إدخال مبلغ صحيح لا يتجاوز الرصيد المتاح.";
            return;
          }
          sendBtn.disabled = true;
          errEl.textContent = "";
          const res = await submitWithdrawalDirect(pro, amt, ph);
          if(!res.ok){
            errEl.textContent = res.error;
            sendBtn.disabled = false;
            return;
          }
          dlg.close();
          toast("تم إرسال طلب السحب وإضافته للإدارة");
          render();
        };
      };
    }
  }

  if(ui.tab === "profile"){
    m.innerHTML = `
      <div class="card">
        <div class="top">
          <div class="av">${svgIcon("user", 24)}</div>
          <div>
            <h3>حساب الحرفي</h3>
            <div class="sub">${currentAuthUser ? (currentAuthUser.email || "") : "غير مسجل الدخول بالبريد الإلكتروني"}</div>
          </div>
          <span class="badge ${currentAuthUser?"ok":""}" style="margin-inline-start:auto">${currentAuthUser?"مسجّل الدخول":"وضع محلي"}</span>
        </div>
        <div class="row" style="margin-top:12px">
          ${currentAuthUser
            ? `<button type="button" class="btn bad sm" id="logoutProBtn">تسجيل الخروج</button>`
            : `<button type="button" class="btn main sm" id="openProLoginBtn">تسجيل الدخول</button>
               <button type="button" class="btn sm" id="openProSignupBtn">حساب جديد</button>`
          }
        </div>
      </div>

      <div class="card">
        <h3 style="margin:0 0 4px">بيانات الحرفي وحالة التواجد</h3>
        <div class="sub">حالة الحساب: <b>${pro.active === false ? "موقوف من الإدارة" : "نشط"}</b> • التوثيق: <b>${pro.verified ? "موثّق ✓" : "غير موثّق"}</b></div>
        <label>اختر ملف الحرفي النشط للتجربة</label>
        <select id="proSwitchSelect">
          ${db.pros.map(p=>`<option value="${p.id}" ${Number(p.id)===Number(pro.id)?"selected":""}>${p.name} — ${p.spec} (${p.city})</option>`).join("")}
        </select>
        <label>الاسم المهني</label>
        <input id="pName" value="${pro.name||""}">
        <label>التخصص</label>
        <select id="pSpec">
          ${SPECS.map(s=>`<option value="${s}" ${pro.spec===s?"selected":""}>${s}</option>`).join("")}
        </select>
        <label>المدينة</label>
        <input id="pCity" value="${pro.city||""}">
        <label>رقم الهاتف</label>
        <input id="pPhone" value="${pro.phone||""}">
        <label>السعر التقديري</label>
        <input id="pPrice" value="${pro.price||""}">
        <label>حالة التواجد</label>
        <select id="pAvail">
          <option value="true" ${pro.available!==false?"selected":""}>متاح لاستقبال الطلبات</option>
          <option value="false" ${pro.available===false?"selected":""}>مشغول حالياً</option>
        </select>
        <label>نبذة عن الخدمات</label>
        <textarea id="pDesc" rows="2">${pro.desc||""}</textarea>
        <div style="margin-top:14px">
          <button class="btn main" id="saveProBtn" style="width:100%">حفظ بيانات الحرفي</button>
        </div>
      </div>
    `;

    document.getElementById("proSwitchSelect").onchange = e => {
      ui.activeProId = Number(e.target.value);
      ui.activeConvKey = "";
      render();
    };
    if(document.getElementById("logoutProBtn")) document.getElementById("logoutProBtn").onclick = logoutPro;
    if(document.getElementById("openProLoginBtn")) document.getElementById("openProLoginBtn").onclick = ()=>openAuthModal("login");
    if(document.getElementById("openProSignupBtn")) document.getElementById("openProSignupBtn").onclick = ()=>openAuthModal("signup");

    document.getElementById("saveProBtn").onclick = ()=>{
      pro.name = document.getElementById("pName").value.trim() || pro.name;
      pro.spec = document.getElementById("pSpec").value;
      pro.city = document.getElementById("pCity").value.trim() || pro.city;
      pro.phone = document.getElementById("pPhone").value.trim() || pro.phone;
      pro.price = document.getElementById("pPrice").value.trim() || "حسب العمل";
      pro.available = document.getElementById("pAvail").value === "true";
      pro.desc = document.getElementById("pDesc").value.trim();
      saveDB();
      toast("تم حفظ بيانات الحرفي");
      render();
    };
  }

  const workBadge = unreadNewOrders > 0 ? unreadNewOrders : newCount;
  const chatBadge = unreadIncomingMsgs > 0 ? unreadIncomingMsgs : 0;
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  [
    ["work","briefcase","الطلبات",workBadge],
    ["chat","chat","الرسائل",chatBadge],
    ["wallet","wallet","المحفظة",0],
    ["profile","user","حسابي",0]
  ].forEach(([k,ic,l,cnt])=>{
    const b = document.createElement("button");
    b.innerHTML = `${cnt>0?`<span class="nav-cnt">${cnt}</span>`:""}${svgIcon(ic,23)}${l}`;
    if(ui.tab === k) b.setAttribute("aria-current","page");
    b.onclick = ()=>{
      ui.tab = k;
      if(k === "work") unreadNewOrders = 0;
      if(k === "chat") unreadIncomingMsgs = 0;
      render();
      window.scrollTo(0,0);
    };
    nav.append(b);
  });
}

initAuthListener();
render();
subscribeSupabaseRealtime();
syncFromSupabase(true);
</script></body></html>
